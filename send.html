<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ชี้จุดแก้ไข</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg-body);
            color: var(--text-dark);
            overflow: hidden;
        }

        /* Header - removed */

        /* Upload Screen */
        .upload-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        .upload-area {
            background: white;
            border: 3px dashed var(--border);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            max-width: 500px;
            width: 100%;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: #f8fafc;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.15);
        }

        .upload-icon {
            font-size: 64px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .upload-area h2 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .upload-area p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Split View */
        .split-container {
            display: none;
            height: 100vh;
            position: relative;
        }

        .split-container.active {
            display: flex;
        }

        .split-left {
            flex: 1;
            background: #1e293b;
            position: relative;
            overflow: hidden;
        }

        /* Canvas Container with Zoom & Pan */
        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .canvas-container.grabbing {
            cursor: grabbing;
        }

        .canvas-wrapper {
            position: absolute;
            transform-origin: 0 0;
        }

        .main-image, .main-pdf {
            display: block;
            user-select: none;
            pointer-events: none;
        }

        /* Markers on Canvas */
        .marker {
            position: absolute;
            border: 2.5px solid var(--danger);
            background: rgba(239, 68, 68, 0.16);
            min-width: 20px;
            min-height: 20px;
            cursor: move;
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.35);
            border-radius: 6px;
            transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s;
            z-index: 10;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .marker.dimmed {
            opacity: 0.35;
            border-color: #000;
            background: rgba(0, 0, 0, 0.1);
        }

        .marker.completed {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.16);
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
        }

        .marker.completed .marker-badge {
            background: var(--success);
        }

        .marker.completed .resize-handle {
            border-color: var(--success);
        }

        .annotation-card.completed {
            border-color: var(--success);
            background: #f0fdf4;
        }

        .annotation-card.completed .marker-number {
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.3);
        }

        .marker.active {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.24);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.35), 0 4px 16px rgba(239, 68, 68, 0.45);
            opacity: 1;
            z-index: 15;
        }

        /* Marker Number Badge */
        .marker-badge {
            position: absolute;
            top: -11px;
            left: -11px;
            width: 24px;
            height: 24px;
            background: var(--danger);
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 11px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }

        .marker.active .marker-badge {
            background: #ef4444;
        }

        .marker.dimmed .marker-badge {
            background: #000;
        }

        /* Resize Handles (Touch-friendly & Precision) */
        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ffffff;
            border: 2px solid var(--danger);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
            border-radius: 50%;
            z-index: 25;
            touch-action: none;
            cursor: pointer;
        }

        /* Hit-area expander for finger touches on mobile */
        .resize-handle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }

        .resize-handle.tl { top: -6px; left: -6px; cursor: nwse-resize; }
        .resize-handle.tr { top: -6px; right: -6px; cursor: nesw-resize; }
        .resize-handle.bl { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .resize-handle.br { bottom: -6px; right: -6px; cursor: nwse-resize; }

        .resize-handle.tc { top: -6px; left: calc(50% - 8px); width: 16px; border-radius: 4px; cursor: ns-resize; }
        .resize-handle.bc { bottom: -6px; left: calc(50% - 8px); width: 16px; border-radius: 4px; cursor: ns-resize; }
        .resize-handle.ml { top: calc(50% - 8px); left: -6px; height: 16px; border-radius: 4px; cursor: ew-resize; }
        .resize-handle.mr { top: calc(50% - 8px); right: -6px; height: 16px; border-radius: 4px; cursor: ew-resize; }

        .marker.active .resize-handle {
            border-color: #ef4444;
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.35), 0 2px 6px rgba(0,0,0,0.3);
        }

        .marker.dimmed .resize-handle {
            display: none;
        }

        /* Cross-page marker (belongs to another page) */
        .marker.cross-page {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            opacity: 0.75;
            cursor: pointer;
        }

        .marker.cross-page:hover {
            opacity: 1;
            background: rgba(59, 130, 246, 0.2);
            border-color: #60a5fa;
        }

        .marker.cross-page .marker-badge {
            background: #3b82f6;
        }

        .marker.cross-page .resize-handle {
            display: none;
        }

        .marker.cross-page .page-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: white;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            pointer-events: none;
            white-space: nowrap;
        }

        /* Arrow Line pointing to annotation card */
        .arrow-line {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }

        .arrow-line line {
            stroke: var(--danger);
            stroke-width: 3;
        }

        .arrow-line polygon {
            fill: var(--danger);
        }

        /* Right Panel */
        .split-right {
            width: 320px;
            background: white;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .count-badge {
            background: var(--primary);
            color: white;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-add {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-add:hover {
            background: #059669;
            transform: scale(1.05);
        }

        .annotations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .annotation-card {
            background: white;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .annotation-card:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 10px rgba(79, 70, 229, 0.15);
        }

        .annotation-card.active {
            border-color: var(--danger);
            background: #fff5f5;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .marker-number {
            width: 28px;
            height: 28px;
            background: var(--danger);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .annotation-card.active .marker-number {
            background: var(--danger);
            box-shadow: 0 0 0 3px rgba(239,68,68,0.3);
        }

        .btn-delete {
            background: none;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            padding: 5px 7px;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
            line-height: 1;
        }

        .btn-delete:hover {
            background: #fee2e2;
            color: var(--danger);
        }

        .annotation-text {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 64px;
            transition: border-color 0.2s;
            line-height: 1.6;
            color: var(--text-dark);
        }

        .annotation-text:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }

        /* Floating Add Button in center of canvas */
        .btn-add-float {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 4px 16px rgba(16,185,129,0.45);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: 'Sarabun', sans-serif;
        }

        .btn-add-float:hover {
            background: #059669;
            transform: translateX(-50%) scale(1.06);
            box-shadow: 0 6px 20px rgba(16,185,129,0.55);
        }

        .btn-add-float:active {
            transform: translateX(-50%) scale(0.97);
        }

        /* Zoom Controls */
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
        }

        .zoom-btn {
            width: 48px;
            height: 48px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-dark);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }

        .zoom-level {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 6px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Page Navigation */
        .page-nav {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border: 2px solid #6366f1;
            border-radius: 14px;
            padding: 8px 18px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.5);
        }

        .page-nav button {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.2s;
        }

        .page-nav button:hover:not(:disabled) {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.6);
        }

        .page-nav button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-nav .page-input {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-weight: 700;
            font-size: 15px;
            width: 48px;
            text-align: center;
            border-radius: 6px;
            padding: 5px 2px;
            outline: none;
            -moz-appearance: textfield;
        }

        .page-nav .page-input::-webkit-inner-spin-button,
        .page-nav .page-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .page-nav .page-input:focus {
            border-color: #c4b5fd;
            box-shadow: 0 0 0 2px rgba(196, 181, 253, 0.4);
        }

        .page-nav .page-sep {
            color: rgba(255,255,255,0.6);
            font-weight: 600;
            font-size: 15px;
        }

        .page-nav .page-total {
            color: white;
            font-weight: 700;
            font-size: 15px;
            user-select: none;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 36px;
            color: #cbd5e1;
            margin-bottom: 12px;
            display: block;
        }

        .empty-state p {
            font-size: 14px;
            line-height: 1.6;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Loading Progress Bar styles */
        .progress-container {
            width: 280px;
            background: rgba(255, 255, 255, 0.15);
            height: 10px;
            border-radius: 10px;
            margin: 15px auto 5px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
            transition: width 0.1s ease-out;
            border-radius: 10px;
        }

        .loading-percent {
            font-size: 15px;
            color: #34d399;
            font-weight: 700;
            margin-top: 5px;
            display: none;
        }

        /* Job Status Banner & Start Job */
        .job-status-banner {
            padding: 12px 0 28px 0;
            margin-top: 8px;
            background: transparent;
            border: none;
            box-shadow: none;
            width: 100%;
        }

        .btn-start-job {
            position: relative;
            overflow: hidden;
            width: 100%;
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 25%, #2563eb 50%, #0284c7 75%, #4338ca 100%);
            background-size: 300% 300%;
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            font-family: inherit;
            letter-spacing: 0.3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 18px rgba(79, 70, 229, 0.4), 0 0 0 0 rgba(99, 102, 241, 0.65);
            animation: startBtnPulse 2.2s infinite ease-in-out, gradientShift 6s ease infinite;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glowing radar pulse & breathing scale */
        @keyframes startBtnPulse {
            0% {
                box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4), 0 0 0 0 rgba(99, 102, 241, 0.65);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 8px 28px rgba(79, 70, 229, 0.6), 0 0 0 12px rgba(99, 102, 241, 0);
                transform: scale(1.025);
            }
            100% {
                box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4), 0 0 0 0 rgba(99, 102, 241, 0);
                transform: scale(1);
            }
        }

        /* Continuous moving background gradient */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Shimmer light sweep across the button */
        .btn-start-job::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -80%;
            width: 50%;
            height: 220%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.55) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            animation: btnShimmerSweep 2.6s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        @keyframes btnShimmerSweep {
            0% {
                left: -80%;
            }
            40%, 100% {
                left: 160%;
            }
        }

        /* Bouncing rocket icon animation */
        .btn-start-job .fa-rocket {
            font-size: 18px;
            display: inline-block;
            animation: rocketWiggle 1.8s infinite ease-in-out;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
        }

        @keyframes rocketWiggle {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            20% {
                transform: translate(-1px, -2px) rotate(-10deg);
            }
            40% {
                transform: translate(2px, -4px) rotate(8deg) scale(1.15);
            }
            60% {
                transform: translate(-1px, -2px) rotate(-6deg);
            }
            80% {
                transform: translate(1px, 0) rotate(2deg);
            }
        }

        .btn-start-job:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(79, 70, 229, 0.65), 0 0 0 4px rgba(129, 140, 248, 0.4);
        }

        .btn-start-job:active {
            transform: scale(0.97);
            animation: none;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
        }

        /* Processing View */
        .job-processing-view {
            background: #ffffff;
            border: 1.5px solid #c7d2fe;
            border-radius: 10px;
            padding: 10px 12px;
            box-shadow: 0 2px 10px rgba(79, 70, 229, 0.08);
        }

        .processing-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .processing-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #3730a3;
        }

        .processing-glow-dot {
            width: 9px;
            height: 9px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: glowPulse 1.4s infinite;
            flex-shrink: 0;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .btn-reset-job {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-reset-job:hover {
            border-color: #cbd5e1;
            color: var(--text-dark);
            background: #f8fafc;
        }

        .progress-track-wrapper {
            width: 100%;
            height: 7px;
            background: #e0e7ff;
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .animated-line-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #4f46e5 0%, #06b6d4 50%, #10b981 100%, #4f46e5 200%);
            background-size: 200% 100%;
            border-radius: 99px;
            animation: streamBar 1.4s linear infinite;
        }

        @keyframes streamBar {

    <!-- Firebase -->

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDbey3w2Pd3WsFxEBs1uMYr_mNhSMZaO9c",
            authDomain: "chat-11059.firebaseapp.com",
            databaseURL: "https://chat-11059-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chat-11059",
            storageBucket: "chat-11059.firebasestorage.app",
            messagingSenderId: "488357665824",
            appId: "1:488357665824:web:717a7be19945cc2462b045"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // PDF.js Configuration
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Upload APIs (smart fallback system)
        const UPLOAD_APIS = {
            litterbox: 'https://litterbox.catbox.moe/resources/internals/api.php',
            tmpfiles: 'https://tmpfiles.org/api/v1/upload',
            uguu: 'https://uguu.se/upload',
            fileio: 'https://file.io/'
        };

        // Elements
        const uploadContainer = document.getElementById('uploadContainer');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const splitContainer = document.getElementById('splitContainer');
        const canvasContainer = document.getElementById('canvasContainer');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const mainImage = document.getElementById('mainImage');
        const pdfCanvas = document.getElementById('pdfCanvas');
        const annotationsList = document.getElementById('annotationsList');
        const annotationsCards = document.getElementById('annotationsCards');
        const annotationCount = document.getElementById('annotationCount');
        const addMarkerBtn = document.getElementById('addMarkerBtn');
        const addMarkerFloatBtn = document.getElementById('addMarkerFloatBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const resetZoomBtn = document.getElementById('resetZoomBtn');
        const zoomLevel = document.getElementById('zoomLevel');
        const expiryTimer = document.getElementById('expiryTimer');
        const expiryTime = document.getElementById('expiryTime');
        const pageNav = document.getElementById('pageNav');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const pageInput = document.getElementById('pageInput');
        const pageTotal = document.getElementById('pageTotal');

        // Job Action & Completion Popup Elements
        const jobStatusBanner = document.getElementById('jobStatusBanner');
        const jobReadyView = document.getElementById('jobReadyView');
        const jobProcessingView = document.getElementById('jobProcessingView');
        const btnStartJob = document.getElementById('btnStartJob');
        const btnResetJob = document.getElementById('btnResetJob');
        const completionPopupTag = document.getElementById('completionPopupTag');
        const completionPopupClose = document.getElementById('completionPopupClose');

        // State
        let sessionId = null;
        let fileUrl = null;
        let fileType = null;
        let annotations = {};
        let markerCounter = 1;
        let activeMarkerId = null;
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let userDismissedCompletion = false;
        
        // Zoom & Pan State
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;
        let isClickSuppressed = false;
        let panStartX = 0;
        let panStartY = 0;
        
        // Drag & Resize State
        let isDragging = false;
        let isResizing = false;
        let currentMarker = null;
        let dragStartX = 0;
        let dragStartY = 0;
        let markerStartX = 0;
        let markerStartY = 0;
        let resizePos = null;

        // Get event position (works for mouse and touch, including touchend)
        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            if (e.changedTouches && e.changedTouches.length > 0) {
                return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        // Check URL for existing session
        const urlParams = new URLSearchParams(window.location.search);
        const existingSession = urlParams.get('id');

        // ลบ session หมดอายุทุกครั้งที่เปิดหน้า (ไม่ว่าจะมี ?id หรือเปล่า)
        cleanupExpiredSessions();

        if (existingSession) {
            loadExistingSession(existingSession);
        }

        // Upload handlers
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        ['dragover', 'dragenter'].forEach(evt => {
            uploadArea.addEventListener(evt, (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--primary)';
                uploadArea.style.background = '#eef2ff';
            });
        });

        ['dragleave', 'drop'].forEach(evt => {
            uploadArea.addEventListener(evt, (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '';
                uploadArea.style.background = '';
                if (e.type === 'drop' && e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFileSelect();
                }
            });
        });

        async function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            const isPDF = file.type === 'application/pdf';
            const isImage = file.type.startsWith('image/');

            if (!isPDF && !isImage) {
                alert('กรุณาเลือกไฟล์รูปภาพหรือ PDF เท่านั้น');
                return;
            }

            showLoading('กำลังอัพโหลดไฟล์...');

            try {
                // Upload file
                const uploadResult = await uploadFile(file);
                
                if (!uploadResult.success) {
                    throw new Error(uploadResult.error || 'อัพโหลดล้มเหลว');
                }

                fileUrl = uploadResult.url;
                fileType = isPDF ? 'pdf' : 'image';

                // Create new session in Firebase
                sessionId = generateSessionId();
                await database.ref(`annotations/${sessionId}`).set({
                    fileUrl: fileUrl,
                    fileType: fileType,
                    createdAt: Date.now(),
                    expiresAt: Date.now() + (60 * 60 * 1000), // 1 hour from now
                    markers: {}
                });

                // Update URL
                const newUrl = `${window.location.origin}${window.location.pathname}?id=${sessionId}`;
                window.history.pushState({}, '', newUrl);

                // Load file
                await loadFile(fileUrl, fileType);
                
                hideLoading();
                uploadContainer.classList.add('hidden');
                splitContainer.classList.add('active');
                addMarkerFloatBtn.classList.remove('hidden');

                // Listen for changes
                listenToChanges();
                
                // Start countdown
                startExpiryCountdown(Date.now() + (60 * 60 * 1000));
                
                // รอให้ DOM update ก่อนเรียก fitToScreen อีกครั้ง
                setTimeout(() => fitToScreen(), 100);
            } catch (err) {
                hideLoading();
                console.error(err);
                alert('เกิดข้อผิดพลาด: ' + err.message);
            }
        }

        async function loadExistingSession(id) {
            console.log('🔄 Loading existing session:', id);
            showLoading('กำลังโหลดข้อมูล...');
            
            try {
                const snapshot = await database.ref(`annotations/${id}`).once('value');
                const data = snapshot.val();
                
                console.log('📦 Firebase data:', data);
                
                if (!data) {
                    throw new Error('ไม่พบข้อมูล');
                }

                // Check if expired
                if (data.expiresAt && Date.now() > data.expiresAt) {
                    console.warn('⏰ Session expired');
                    // Delete expired session
                    await database.ref(`annotations/${id}`).remove();
                    if (data.fileUrl && data.fileUrl.startsWith('fb_')) {
                        deleteFirebaseFile(data.fileUrl.substring(3));
                    }
                    throw new Error('เซสชันหมดอายุแล้ว (1 ชม.)');
                }

                sessionId = id;
                fileUrl = data.fileUrl;
                fileType = data.fileType;
                annotations = data.markers || {};

                console.log('✅ Session loaded:', { sessionId, fileUrl, fileType, markersCount: Object.keys(annotations).length });

                // Count markers (max number + 1)
                markerCounter = Object.values(annotations).reduce((max, m) => Math.max(max, m.number || 0), 0) + 1;

                // Load file
                console.log('🚀 Calling loadFile with:', fileUrl, fileType);
                await loadFile(fileUrl, fileType);
                
                hideLoading();
                uploadContainer.classList.add('hidden');
                splitContainer.classList.add('active');
                addMarkerFloatBtn.classList.remove('hidden');
                
                // รอให้ DOM update ก่อนเรียก fitToScreen
                await new Promise(resolve => setTimeout(resolve, 50));
                
                // Render markers immediately from loaded data (ไม่ต้องพึ่ง realtime sync)
                renderAllMarkers();

                // Check job status from session
                if (data.jobStatus === 'processing') {
                    updateJobStatusUI(true);
                } else {
                    updateJobStatusUI(false);
                }
                checkCompletionStatus();

                // Listen for changes (realtime sync)
                listenToChanges();
                
                // Start countdown
                startExpiryCountdown(data.expiresAt);
                
                console.log('✅ Everything loaded successfully!');
            } catch (err) {
                hideLoading();

            console.log('📤 Starting upload:', { type: file.type, size: file.size });

            // Try upload services based on file type
            if (isPDF || isImage) {
                // Order: Litterbox → Firebase (Private) → tmpfiles → file.io → Uguu (สุดท้าย)
                let result = await uploadLitterbox(file);
                if (result.success) {
                    console.log('✅ Uploaded via Litterbox');
                    return result;
                }

                console.warn('⚠️ Litterbox failed, trying Firebase (Private Cloud)...');
                result = await uploadFirebase(file);
                if (result.success) {
                    console.log('✅ Uploaded via Firebase');
                    return result;
                }

                console.warn('⚠️ Firebase failed, trying tmpfiles...');
                result = await uploadTmpfiles(file);
                if (result.success) {
                    console.log('✅ Uploaded via tmpfiles');
                    return result;
                }

                console.warn('⚠️ tmpfiles failed, trying file.io...');
                result = await uploadFileIO(file);
                if (result.success) {

                    return result;

                console.warn('⚠️ file.io failed, trying Uguu (last resort)...');
                result = await uploadUguu(file);

                    return result;
                }

            console.error('❌ All upload services failed');

        async function loadFile(url, type) {
            console.log('🔍 loadFile called:', { url, type });
            
            let finalUrl = url;
            let rawBytesBuffer = null;

            if (url && url.startsWith('fb_')) {
                const fileId = url.substring(3);
                const stepName = 'กำลังโหลดไฟล์จาก Firebase Cloud...';
                showLoading(stepName);
                updateLoadingProgress(stepName, 25);

                try {
                    let fileData = null;
                    if (typeof database !== 'undefined') {
                        const snap = await database.ref(`temp_files/${fileId}`).once('value');
                        fileData = snap.val();
                    }
                    if (!fileData) {
                        const resp = await fetch(`https://chat-11059-default-rtdb.asia-southeast1.firebasedatabase.app/temp_files/${fileId}.json`);
                        fileData = await resp.json();
                    }

                    if (!fileData || !fileData.data) {
                        throw new Error('ไม่พบไฟล์ใน Firebase หรือไฟล์หมดอายุ/ถูกลบแล้ว');
                    }

                    updateLoadingProgress('กำลังประมวลผลไฟล์...', 75);
                    const binary = atob(fileData.data);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }
                    rawBytesBuffer = bytes.buffer;

                    const isPdf = type === 'pdf' || (fileData.filename && fileData.filename.toLowerCase().endsWith('.pdf'));
                    const mimeType = isPdf ? 'application/pdf' : 'image/jpeg';
                    const blob = new Blob([bytes], { type: mimeType });
                    finalUrl = URL.createObjectURL(blob);
                    window.__firebaseFileId = fileId;
                    console.log('✅ Firebase file converted to Blob URL:', finalUrl);
                } catch (fbErr) {
                    console.error('❌ Firebase load error:', fbErr);
                    throw new Error('โหลดไฟล์จาก Firebase ไม่สำเร็จ: ' + fbErr.message);
                }
            } else if (url && url.includes('tmpfiles.org') && !url.includes('corsproxy.io')) {
                console.warn('⚠️ tmpfiles.org detected - using CORS proxy');
                finalUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
            }

            const stepName = 'กำลังดาวน์โหลดไฟล์เพื่อแสดงผล...';
            showLoading(stepName);

            if (type === 'image') {
                return new Promise((resolve, reject) => {
                    console.log('📸 Loading image...');
                    
                    const tryLoad = (src, attempt = 1) => {
                        mainImage.onload = () => {
                            console.log('✅ Image loaded successfully:', src);
                            mainImage.style.display = 'block';
                            pdfCanvas.style.display = 'none';
                            fitToScreen();
                            resolve();
                        };
                        mainImage.onerror = () => {
                            if (src.startsWith('blob:')) {
                                reject(new Error('ไม่สามารถแสดงผลรูปภาพจากข้อมูลที่แปลงได้'));
                                return;
                            }
                            if (attempt === 1) {
                                console.warn('⚠️ Direct image load failed, trying weserv proxy...');
                                const proxyUrl = 'https://images.weserv.nl/?url=' + encodeURIComponent(url);
                                tryLoad(proxyUrl, 2);
                            } else if (attempt === 2) {
                                console.warn('⚠️ Weserv proxy failed, trying corsproxy...');
                                const corsUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
                                tryLoad(corsUrl, 3);
                            } else {
                                reject(new Error('ไม่สามารถดาวน์โหลดไฟล์มาแสดงผลได้'));
                            }
                        };
                        mainImage.src = src;
                    };

                    tryLoad(finalUrl, 1);
                });
            } else if (type === 'pdf') {
                try {
                    console.log('📄 Loading PDF...');
                    try {
                        if (rawBytesBuffer) {
                            pdfDoc = await pdfjsLib.getDocument({ data: rawBytesBuffer }).promise;
                        } else {
                            pdfDoc = await pdfjsLib.getDocument(finalUrl).promise;
                        }
                    } catch (pdfErr) {
                        console.warn('Direct PDF load failed, trying CORS proxy...', pdfErr);
                        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
                        pdfDoc = await pdfjsLib.getDocument(proxyUrl).promise;
                    }

                    totalPages = pdfDoc.numPages;
                    currentPage = 1;
                    
                    await renderPdfPage(currentPage);
                    
                    console.log('✅ PDF loaded successfully, pages:', totalPages);
                    pdfCanvas.style.display = 'block';
                    mainImage.style.display = 'none';
                    pageNav.style.display = 'flex';
                    updatePageInfo();
                    fitToScreen();
                } catch (err) {
                    console.error('❌ PDF load error:', err);
                    throw new Error('โหลด PDF ไม่สำเร็จ: ' + err.message);
                }
            }
        }

        function uploadWithXHR(url, formData, stepName) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', url, true);

                xhr.upload.onprogress = function(e) {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        updateLoadingProgress(stepName, percent);
                    }
                };

                xhr.onload = function() {
                    if (this.status >= 200 && this.status < 300) {
                        resolve(this.responseText);
                    } else {
                        reject(new Error(`Upload failed with status ${this.status}`));
                    }
                };

                xhr.onerror = function() {
                    reject(new Error('Network error during upload'));
                };

                xhr.send(formData);
            });
        }

        function downloadWithProgress(url, stepName) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.responseType = 'blob';

                xhr.onload = function() {
                    if (this.status >= 200 && this.status < 300) {
                        resolve(this.response);
                    } else {
                        reject(new Error(`Download failed with status ${this.status}`));
                    }
                };

                xhr.onerror = function() {
                    reject(new Error('Network error during download'));
                };

                xhr.onprogress = function(e) {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        updateLoadingProgress(stepName, percent);
                    }
                };

                xhr.send();
            });
        }

        // ===== ZOOM & PAN =====
        function fitToScreen() {
            const container = canvasContainer.getBoundingClientRect();
            const content = fileType === 'image' ? mainImage : pdfCanvas;
            const contentWidth = content.naturalWidth || content.width;
            const contentHeight = content.naturalHeight || content.height;

            console.log('📐 fitToScreen:', {
                containerWidth: container.width,
                containerHeight: container.height,
                contentWidth,
                contentHeight,
                fileType
            });

            if (!contentWidth || !contentHeight) {
                console.error('❌ Invalid content dimensions!');
                return;
            }

            // ถ้า container ยังไม่มีขนาด (0x0) ให้รอแล้วลองใหม่
            if (container.width === 0 || container.height === 0) {
                console.warn('⚠️ Container not ready, retrying...');
                setTimeout(() => fitToScreen(), 100);
                return;
            }

            const scaleX = container.width / contentWidth;
            const scaleY = container.height / contentHeight;
            scale = Math.min(scaleX, scaleY, 1) * 0.9;

            translateX = (container.width - contentWidth * scale) / 2;
            translateY = (container.height - contentHeight * scale) / 2;

            console.log('✅ Calculated scale:', { scale, translateX, translateY });
            updateTransform();
        }

        function updateTransform() {
            canvasWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            zoomLevel.textContent = Math.round(scale * 100) + '%';
            
            console.log('🎨 Transform updated:', {
                transform: canvasWrapper.style.transform,
                wrapperDisplay: getComputedStyle(canvasWrapper).display,
                imageDisplay: getComputedStyle(mainImage).display,
                imageVisible: mainImage.offsetWidth > 0 && mainImage.offsetHeight > 0
            });
        }

        zoomInBtn.addEventListener('click', () => {
            scale = Math.min(scale * 1.2, 5);
            updateTransform();
            renderArrows();
        });

        zoomOutBtn.addEventListener('click', () => {
            scale = Math.max(scale / 1.2, 0.1);
            updateTransform();

        });

        let pageInputTimeout;
        pageInput.addEventListener('input', () => {

        // Mouse wheel zoom
        canvasContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const rect = canvasContainer.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const oldScale = scale;
            scale = Math.max(0.1, Math.min(5, scale * delta));

            translateX = mouseX - (mouseX - translateX) * (scale / oldScale);
            translateY = mouseY - (mouseY - translateY) * (scale / oldScale);

            updateTransform();
            renderArrows();
        });

        // Pan with mouse
        canvasContainer.addEventListener('mousedown', (e) => {
            if (e.target === canvasContainer || e.target === canvasWrapper || e.target === mainImage || e.target === pdfCanvas) {
                isPanning = true;
                isClickSuppressed = false;
                panStartX = e.clientX;
                panStartY = e.clientY;
                canvasContainer.classList.add('grabbing');
                startPanX = e.clientX - translateX;
                startPanY = e.clientY - translateY;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isPanning) {
                if (Math.hypot(e.clientX - panStartX, e.clientY - panStartY) > 6) {
                    isClickSuppressed = true;
                }
                translateX = e.clientX - startPanX;
                translateY = e.clientY - startPanY;
                updateTransform();
                renderArrows();
            }
        });

        document.addEventListener('mouseup', () => {
            isPanning = false;
            canvasContainer.classList.remove('grabbing');
        });

        // Touch support (mobile)
        let touchStartDist = 0;
        let touchStartScale = 1;

        canvasContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isClickSuppressed = true;
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                touchStartScale = scale;
            } else if (e.touches.length === 1) {
                // Don't start panning if touching a marker or handle
                if (e.target.closest('.marker')) return;
                isPanning = true;
                isClickSuppressed = false;
                panStartX = e.touches[0].clientX;
                panStartY = e.touches[0].clientY;
                startPanX = e.touches[0].clientX - translateX;
                startPanY = e.touches[0].clientY - translateY;
            }
        });

        canvasContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            
            if (e.touches.length === 2) {
                isClickSuppressed = true;
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                scale = Math.max(0.1, Math.min(5, touchStartScale * (dist / touchStartDist)));
                updateTransform();
                renderArrows();
            } else if (e.touches.length === 1 && isPanning) {
                if (Math.hypot(e.touches[0].clientX - panStartX, e.touches[0].clientY - panStartY) > 6) {
                    isClickSuppressed = true;
                }
                translateX = e.touches[0].clientX - startPanX;
                translateY = e.touches[0].clientY - startPanY;
                updateTransform();
                renderArrows();
            }
        });

        canvasContainer.addEventListener('touchend', () => {
            isPanning = false;
        });

        function addMarker(clickX = null, clickY = null, width = 14, height = 8, text = '') {
            const markerId = 'marker_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const number = markerCounter++;

            let x = 25;
            let y = 25;
            if (clickX !== null && clickY !== null) {
                // Center the marker accurately on the clicked / tapped spot
                x = Math.max(0, Math.min(100 - width, clickX - width / 2));
                y = Math.max(0, Math.min(100 - height, clickY - height / 2));
            }

            const marker = {
                id: markerId,
                number: number,
                page: currentPage,
                x: Math.round(x * 100) / 100,
                y: Math.round(y * 100) / 100,
                width: width,
                height: height,
                text: text,
                done: false
            };

            // Save to Firebase
            if (sessionId) {
                database.ref(`annotations/${sessionId}/markers/${markerId}`).set(marker);
            } else {
                annotations[markerId] = marker;
                renderMarker(marker);
                renderAnnotationCard(marker);
                annotationCount.textContent = Object.keys(annotations).length;
                renderArrows();
                checkCompletionStatus();
            }
        }

            if (!isDragging && !isResizing && !isClickSuppressed) {
                const rect = pdfCanvas.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                addMarker(x, y);
            }
            isClickSuppressed = false;
        });

        function renderAllMarkers() {
            // Clear existing markers
            document.querySelectorAll('.marker').forEach(el => el.remove());
            document.querySelectorAll('.arrow-line').forEach(el => el.remove());
            if (annotationsCards) {
                annotationsCards.innerHTML = '';
            } else if (annotationsList) {
                annotationsList.innerHTML = '';
            }

            const allMarkers = Object.values(annotations);

            if (allMarkers.length === 0) {
                const emptyHtml = `
                    <div class="empty-state">
                        <i class="fa-regular fa-circle-dot"></i>
                        <p><strong>ยังไม่มีจุดแก้ไข</strong></p>
                        <p>คลิกปุ่ม "เพิ่ม" หรือคลิกที่ไฟล์ด้านซ้าย</p>
                    </div>
                `;
                if (annotationsCards) {
                    annotationsCards.innerHTML = emptyHtml;
                } else if (annotationsList) {
                    annotationsList.innerHTML = emptyHtml;
                }
                if (jobStatusBanner) jobStatusBanner.classList.add('hidden');
                annotationCount.textContent = '0';
                checkCompletionStatus();
                return;
            }

            if (jobStatusBanner) jobStatusBanner.classList.remove('hidden');

            const sortedMarkers = allMarkers.sort((a, b) => a.number - b.number);
            
            sortedMarkers.forEach(marker => {
                if (!marker.page || marker.page === currentPage) {
                    renderMarker(marker);
                }
                renderAnnotationCard(marker);
            });

            annotationCount.textContent = sortedMarkers.length;
            
            // Check completion status
            checkCompletionStatus();

            // Render arrows
            setTimeout(renderArrows, 100);
        }

        function renderMarker(marker) {
            const isCrossPage = marker.page && marker.page !== currentPage;
            const markerEl = document.createElement('div');
            markerEl.className = 'marker' + (isCrossPage ? ' cross-page' : '') + (marker.done ? ' completed' : '');
            markerEl.dataset.id = marker.id;
            markerEl.style.left = marker.x + '%';
            markerEl.style.top = marker.y + '%';
            markerEl.style.width = marker.width + '%';
            markerEl.style.height = marker.height + '%';

            const badge = document.createElement('div');
            badge.className = 'marker-badge';
            badge.textContent = marker.number;
            markerEl.appendChild(badge);

            if (isCrossPage) {
                const pageLabel = document.createElement('div');
                pageLabel.className = 'page-label';
                pageLabel.textContent = 'p.' + marker.page;
                markerEl.appendChild(pageLabel);
            }

            // Resize handles (8 handles for high-precision dragging and resizing on mobile & desktop)
            if (!isCrossPage) {
                const handlePositions = ['tl', 'tc', 'tr', 'ml', 'mr', 'bl', 'bc', 'br'];
                handlePositions.forEach(pos => {
                    const handle = document.createElement('div');
                    handle.className = `resize-handle ${pos}`;
                    handle.dataset.pos = pos;
                    markerEl.appendChild(handle);

                    handle.addEventListener('mousedown', (e) => {
                        e.stopPropagation();
                        startResize(e, marker, pos);
                    });
                    handle.addEventListener('touchstart', (e) => {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                        startResize(e, marker, pos);
                    }, { passive: false });
                });
            }

            markerEl.addEventListener('mousedown', (e) => {
                if (isCrossPage) return;
                if (!e.target.classList.contains('resize-handle')) {
                    e.stopPropagation();
                    startDrag(e, marker);
                }
            });
            markerEl.addEventListener('touchstart', (e) => {
                if (isCrossPage) return;
                if (!e.target.classList.contains('resize-handle')) {
                    e.stopPropagation();
                    if (e.cancelable) e.preventDefault();
                    startDrag(e, marker);
                }
            }, { passive: false });

            markerEl.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (isCrossPage) {
                    await gotoPage(marker.page);
                }
                setActiveMarker(marker.id);
            });

            canvasWrapper.appendChild(markerEl);
        }

        function startDrag(e, marker) {
            isDragging = true;
            currentMarker = marker;
            const pos = getEventPos(e);
            
            dragStartX = pos.x;
            dragStartY = pos.y;
            markerStartX = marker.x;
            markerStartY = marker.y;

            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('touchmove', onDragMove, { passive: false });
            document.addEventListener('touchend', onDragEnd);
        }

        function onDragMove(e) {
            if (!isDragging || !currentMarker) return;
            if (e.cancelable) e.preventDefault();

            const content = fileType === 'image' ? mainImage : pdfCanvas;
            const contentRect = content.getBoundingClientRect();
            const pos = getEventPos(e);

            const dx = ((pos.x - dragStartX) / contentRect.width) * 100;
            const dy = ((pos.y - dragStartY) / contentRect.height) * 100;

            currentMarker.x = Math.max(0, Math.min(100 - currentMarker.width, markerStartX + dx));
            currentMarker.y = Math.max(0, Math.min(100 - currentMarker.height, markerStartY + dy));

            const markerEl = document.querySelector(`.marker[data-id="${currentMarker.id}"]`);
            if (markerEl) {
                markerEl.style.left = currentMarker.x + '%';
                markerEl.style.top = currentMarker.y + '%';
            }

            renderArrows();
        }

        function onDragEnd() {
            if (isDragging && currentMarker) {
                // Save to Firebase
                if (sessionId) {
                    database.ref(`annotations/${sessionId}/markers/${currentMarker.id}`).update({
                        x: currentMarker.x,
                        y: currentMarker.y
                    });
                }
                renderArrows();
            }
            isDragging = false;
            currentMarker = null;
            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('mouseup', onDragEnd);
            document.removeEventListener('touchmove', onDragMove);
            document.removeEventListener('touchend', onDragEnd);
        }

        function startResize(e, marker, pos) {
            isResizing = true;
            currentMarker = marker;
            resizePos = pos;

            const eventPos = getEventPos(e);
            dragStartX = eventPos.x;
            dragStartY = eventPos.y;
            markerStartX = marker.x;
            markerStartY = marker.y;

            const markerStartWidth = marker.width;
            const markerStartHeight = marker.height;

            document.addEventListener('mousemove', onResizeMove);
            document.addEventListener('mouseup', onResizeEnd);
            document.addEventListener('touchmove', onResizeMove, { passive: false });
            document.addEventListener('touchend', onResizeEnd);

            function onResizeMove(e) {
                if (!isResizing || !currentMarker) return;
                if (e.cancelable) e.preventDefault();

                const content = fileType === 'image' ? mainImage : pdfCanvas;
                const contentRect = content.getBoundingClientRect();
                const pos = getEventPos(e);

                const dx = ((pos.x - dragStartX) / contentRect.width) * 100;
                const dy = ((pos.y - dragStartY) / contentRect.height) * 100;

                const markerEl = document.querySelector(`.marker[data-id="${currentMarker.id}"]`);
                if (!markerEl) return;

                const minW = 2.5; // Min 2.5% for tiny words / single numbers
                const minH = 2.0;

                if (resizePos.includes('r')) {
                    currentMarker.width = Math.max(minW, Math.min(100 - currentMarker.x, markerStartWidth + dx));
                }
                if (resizePos.includes('l')) {
                    const maxAllowedChange = markerStartWidth - minW;
                    const clampedDx = Math.min(dx, maxAllowedChange);
                    const targetX = markerStartX + clampedDx;
                    if (targetX >= 0) {
                        currentMarker.x = targetX;
                        currentMarker.width = markerStartWidth - clampedDx;
                    } else {
                        currentMarker.x = 0;
                        currentMarker.width = markerStartX + markerStartWidth;
                    }
                    markerEl.style.left = currentMarker.x + '%';
                }
                if (resizePos.includes('b')) {
                    currentMarker.height = Math.max(minH, Math.min(100 - currentMarker.y, markerStartHeight + dy));
                }
                if (resizePos.includes('t')) {
                    const maxAllowedChange = markerStartHeight - minH;
                    const clampedDy = Math.min(dy, maxAllowedChange);
                    const targetY = markerStartY + clampedDy;
                    if (targetY >= 0) {
                        currentMarker.y = targetY;
                        currentMarker.height = markerStartHeight - clampedDy;
                    } else {
                        currentMarker.y = 0;
                        currentMarker.height = markerStartY + markerStartHeight;
                    }
                    markerEl.style.top = currentMarker.y + '%';
                }

                markerEl.style.width = currentMarker.width + '%';
                markerEl.style.height = currentMarker.height + '%';

                renderArrows();
            }

            function onResizeEnd() {
                if (isResizing && currentMarker) {
                    // Save to Firebase
                    if (sessionId) {
                        database.ref(`annotations/${sessionId}/markers/${currentMarker.id}`).update({
                            x: currentMarker.x,
                            y: currentMarker.y,
                            width: currentMarker.width,
                            height: currentMarker.height
                        });
                    }
                    renderArrows();
                }
                isResizing = false;
                currentMarker = null;
                resizePos = null;
                document.removeEventListener('mousemove', onResizeMove);
                document.removeEventListener('mouseup', onResizeEnd);
                document.removeEventListener('touchmove', onResizeMove);
                document.removeEventListener('touchend', onResizeEnd);
            }
        }

        // ===== ANNOTATION CARDS =====
        function renderAnnotationCard(marker) {
            const card = document.createElement('div');
            card.className = 'annotation-card' + (marker.done ? ' completed' : '');
            card.dataset.id = marker.id;

            card.innerHTML = `

                    <label class="done-check" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);cursor:pointer;margin:0 auto;">
                        <span style="font-weight:600;color:var(--text-dark);">สถานะงาน:</span>

                        <span class="done-text" style="font-weight:600;color:${marker.done ? 'var(--success)' : 'inherit'};">เสร็จ</span>
                    </label>
                    <div style="display:flex;align-items:center;gap:4px;">
                        ${fileType === 'pdf' ? `<div style="font-size:12px;color:var(--text-muted);font-weight:600;"><i class="fa-solid fa-file"></i> หน้า ${marker.page || 1}</div>` : ''}
                        <button class="btn-delete" title="ลบ">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
                <textarea class="annotation-text" placeholder="พิมพ์รายละเอียดที่ต้องการแก้ไข...">${marker.text || ''}</textarea>
            `;

            const doneInput = card.querySelector('.done-input');
            const doneText = card.querySelector('.done-text');
            doneInput.addEventListener('change', () => {
                const done = doneInput.checked;
                marker.done = done;
                if (annotations[marker.id]) {
                    annotations[marker.id].done = done;
                }
                card.classList.toggle('completed', done);
                if (doneText) {
                    doneText.style.color = done ? 'var(--success)' : 'inherit';
                }
                const mEl = document.querySelector(`.marker[data-id="${marker.id}"]`);
                if (mEl) mEl.classList.toggle('completed', done);
                renderArrows();
                userDismissedCompletion = false;
                checkCompletionStatus();
                if (sessionId) {
                    database.ref(`annotations/${sessionId}/markers/${marker.id}/done`).set(done);

            const textarea = card.querySelector('.annotation-text');
            let saveTimeout;
            textarea.addEventListener('input', () => {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    // Auto-save to Firebase
                    if (sessionId) {
                        database.ref(`annotations/${sessionId}/markers/${marker.id}/text`).set(textarea.value);
                    }
                }, 500);
            });

            const deleteBtn = card.querySelector('.btn-delete');
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('ต้องการลบจุดแก้ไขนี้ใช่ไหม?')) {
                    if (sessionId) {
                        database.ref(`annotations/${sessionId}/markers/${marker.id}`).remove();
                    } else {
                        delete annotations[marker.id];
                        renderAllMarkers();
                    }
                }
            });

            card.addEventListener('click', async () => {
                if (marker.page && marker.page !== currentPage) {
                    await gotoPage(marker.page);
                }
                setActiveMarker(marker.id);
            });

            if (annotationsCards) {
                annotationsCards.appendChild(card);
            } else {
                annotationsList.appendChild(card);

        // ===== JOB STATUS & COMPLETION TAG HANDLERS =====
        function updateJobStatusUI(isProcessing) {
            if (isProcessing) {
                document.body.classList.add('job-started');
                if (jobReadyView) jobReadyView.classList.add('hidden');
                if (jobProcessingView) jobProcessingView.classList.remove('hidden');
            } else {
                document.body.classList.remove('job-started');
                if (jobReadyView) jobReadyView.classList.remove('hidden');
                if (jobProcessingView) jobProcessingView.classList.add('hidden');
            }
        }

        if (btnStartJob) {
            btnStartJob.addEventListener('click', () => {
                const markersCount = Object.keys(annotations).length;
                if (markersCount === 0) {
                    alert('กรุณาเพิ่มจุดแก้ไขและระบุข้อความก่อนกดสั่งให้เริ่มงาน');
                    return;

                updateJobStatusUI(true);

                        jobStatus: 'pending'
                    });
                }

        function checkCompletionStatus() {
            const doneInputs = document.querySelectorAll('.done-input');
            const markers = Object.values(annotations);

            if (doneInputs.length === 0 && markers.length === 0) {
                hideCompletionPopup();
                return;
            }

            const allDomChecked = doneInputs.length > 0 && Array.from(doneInputs).every(inp => inp.checked);
            const allDataDone = markers.length > 0 && markers.every(m => !!m.done);

            if (allDomChecked || allDataDone) {
                if (!userDismissedCompletion) {
                    showCompletionPopup();
                } else if (jobProcessingView) {
                    jobProcessingView.classList.add('completed');
                }
            } else {
                userDismissedCompletion = false;
                hideCompletionPopup();
            }
        }

        function showCompletionPopup() {
            const popup = document.getElementById('completionPopupTag');
            if (popup) {
                popup.classList.add('show');
            }
            if (jobProcessingView) {
                jobProcessingView.classList.add('completed');
            }
            triggerConfetti();
        }

        function hideCompletionPopup() {
            const popup = document.getElementById('completionPopupTag');
            if (popup) {
                popup.classList.remove('show');
            }
            const doneInputs = document.querySelectorAll('.done-input');
            const allChecked = doneInputs.length > 0 && Array.from(doneInputs).every(inp => inp.checked);
            if (!allChecked && jobProcessingView) {
                jobProcessingView.classList.remove('completed');
            }
        }

        const closeBtn = document.getElementById('completionPopupClose');
        if (closeBtn) {
            closeBtn.addEventListener('click', () => {
                userDismissedCompletion = true;
                hideCompletionPopup();
            });
        }

        const okBtn = document.getElementById('completionPopupOkBtn');
        if (okBtn) {
            okBtn.addEventListener('click', () => {
                userDismissedCompletion = true;
                hideCompletionPopup();
            });
        }

        const overlay = document.getElementById('completionPopupTag');
        if (overlay) {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {

                    hideCompletionPopup();
                }
