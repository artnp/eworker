        // ===== CONFETTI CELEBRATION =====
        function triggerConfetti() {
            try {
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 100,
                        spread: 80,
                        origin: { y: 0.5 }
                    });
                    setTimeout(() => {
                        confetti({
                            particleCount: 60,
                            angle: 60,
                            spread: 60,
                            origin: { x: 0.15, y: 0.6 }
                        });
                    }, 200);
                    setTimeout(() => {
                        confetti({
                            particleCount: 60,
                            angle: 120,
                            spread: 60,
                            origin: { x: 0.85, y: 0.6 }
                        });
                    }, 400);
                    return;
                }
            } catch (err) {
                console.warn('Canvas confetti error:', err);
            }
            runFallbackConfetti();
        }

        function runFallbackConfetti() {
            const canvas = document.createElement('canvas');
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100vw';
            canvas.style.height = '100vh';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '99999';
            document.body.appendChild(canvas);
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#ec4899', '#8b5cf6'];
            const particles = Array.from({ length: 90 }, () => ({
                x: canvas.width / 2,
                y: canvas.height * 0.45,
                vx: (Math.random() - 0.5) * 16,
                vy: (Math.random() - 0.7) * 18,
                size: Math.random() * 8 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                rotation: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 12,
                alpha: 1
            }));
            const start = Date.now();
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.38;
                    p.vx *= 0.98;
                    p.rotation += p.rotSpeed;
                    p.alpha -= 0.009;
                    if (p.alpha > 0) {
                        alive = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctx.restore();
                    }
                });
                if (alive && Date.now() - start < 3500) {
                    requestAnimationFrame(animate);
                } else {
                    canvas.remove();
                }
            }
            requestAnimationFrame(animate);
        }

        function setActiveMarker(markerId) {
            activeMarkerId = markerId;

            // Update cards
            document.querySelectorAll('.annotation-card').forEach(card => {
                card.classList.toggle('active', card.dataset.id === markerId);
                if (card.dataset.id === markerId) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    card.querySelector('.annotation-text').focus();
                }
            });

            // Update markers - dim others
            document.querySelectorAll('.marker').forEach(marker => {
                if (marker.dataset.id === markerId) {
                    marker.classList.add('active');
                    marker.classList.remove('dimmed');
                } else {
                    marker.classList.remove('active');
                    marker.classList.add('dimmed');
                }
            });

            renderArrows();
        }

        // ===== ARROWS =====
        function renderArrows() {
            document.querySelectorAll('.arrow-line').forEach(el => el.remove());

            const sortedMarkers = Object.values(annotations).sort((a, b) => a.number - b.number);
            const isMobile = window.innerWidth <= 768;
            const containerRect = splitContainer.getBoundingClientRect();

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.classList.add('arrow-line');
            svg.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5;';

            sortedMarkers.forEach(marker => {
                if (marker.page && marker.page !== currentPage) return;
                const markerEl = document.querySelector(`.marker[data-id="${marker.id}"]`);
                const cardEl = document.querySelector(`.annotation-card[data-id="${marker.id}"]`);
                if (!markerEl || !cardEl) return;

                const mRect = markerEl.getBoundingClientRect();
                const markerNumber = cardEl.querySelector('.marker-number');
                const tRect = markerNumber ? markerNumber.getBoundingClientRect() : cardEl.getBoundingClientRect();

                const isActive = marker.id === activeMarkerId;
                const dimmed = !!(activeMarkerId && marker.id !== activeMarkerId);
                const isDone = marker.done;
                const col = isDone ? 'var(--success)' : (dimmed ? 'rgba(239,68,68,0.25)' : (isActive ? '#ef4444' : 'var(--danger)'));
                const w = dimmed ? '2' : '2.5';
                const op = '1';

                let d, ax, ay;
                if (isMobile) {
                    const mx = mRect.left + mRect.width / 2 - containerRect.left;
                    const my = mRect.bottom - containerRect.top;
                    const tx = tRect.left + tRect.width / 2 - containerRect.left;
                    const ty = tRect.top - containerRect.top;
                    const dy = (ty - my) * 0.45;
                    d = `M ${mx} ${my} C ${mx} ${my + dy}, ${tx} ${ty - dy}, ${tx} ${ty}`;
                    ax = tx; ay = ty;
                } else {
                    const mx = mRect.right - containerRect.left;
                    const my = mRect.top + mRect.height / 2 - containerRect.top;
                    const tx = tRect.left + tRect.width / 2 - containerRect.left;
                    const ty = tRect.top + tRect.height / 2 - containerRect.top;
                    const dx = (tx - mx) * 0.45;
                    d = `M ${mx} ${my} C ${mx + dx} ${my}, ${tx - dx} ${ty}, ${tx} ${ty}`;
                    ax = tx; ay = ty;
                }

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', d);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', col);
                path.setAttribute('stroke-width', w);
                path.setAttribute('opacity', op);
                svg.appendChild(path);

                const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                const s = 8, p = Math.PI / 6;
                arrow.setAttribute('points', `${ax},${ay} ${ax - s * Math.cos(p)},${ay - s * Math.sin(p)} ${ax - s * Math.cos(p)},${ay + s * Math.sin(p)}`);
                arrow.setAttribute('fill', col);
                arrow.setAttribute('opacity', op);
                svg.appendChild(arrow);
            });

            splitContainer.appendChild(svg);
        }

        // Redraw arrows on window resize
        window.addEventListener('resize', renderArrows);

        // Redraw arrows when scrolling annotation list
        annotationsList.addEventListener('scroll', () => {
            requestAnimationFrame(renderArrows);
        });

        // ===== EXPIRY COUNTDOWN =====
        let expiryInterval = null;
        let currentExpiresAt = null;
        const extendBtn = document.getElementById('extendBtn');

        function startExpiryCountdown(expiresAt) {
            if (!expiresAt) return;
            currentExpiresAt = expiresAt;
            expiryTimer.style.display = 'block';

            extendBtn.onclick = extendSession;

            expiryInterval = setInterval(() => {
                const now = Date.now();
                const remaining = currentExpiresAt - now;
                
                if (remaining <= 0) {
                    clearInterval(expiryInterval);
                    extendBtn.style.display = 'none';
                    expiryTime.textContent = 'หมดอายุแล้ว';
                    
                    if (sessionId) {
                        database.ref(`annotations/${sessionId}`).remove();
                    }
                    if (fileUrl && fileUrl.startsWith('fb_')) {
                        deleteFirebaseFile(fileUrl.substring(3));
                    } else if (window.__firebaseFileId) {
                        deleteFirebaseFile(window.__firebaseFileId);
                    }
                    
                    alert('⚠️ เซสชันหมดอายุแล้ว\n\nไฟล์และข้อมูลทั้งหมดถูกลบแล้ว\nกรุณาอัพโหลดใหม่');
                    location.reload();
                    return;
                }
                
                const hours = Math.floor(remaining / 3600000);
                const minutes = Math.floor((remaining % 3600000) / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                
                expiryTime.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                // Show extend button when < 5 minutes
                if (remaining < 5 * 60 * 1000) {
                    expiryTimer.style.color = '#fbbf24';
                    extendBtn.style.display = 'inline';
                } else {
                    extendBtn.style.display = 'none';
                }
                if (remaining < 1 * 60 * 1000) {
                    expiryTimer.style.color = '#ef4444';
                }
            }, 1000);
        }

        async function extendSession() {
            if (!sessionId) return;
            currentExpiresAt = Date.now() + 10 * 60 * 1000;
            await database.ref(`annotations/${sessionId}`).update({ expiresAt: currentExpiresAt });
            extendBtn.style.display = 'none';
            expiryTimer.style.color = '#fde68a';
        }

        // ===== FIREBASE SYNC =====
        function listenToChanges() {
            if (!sessionId) return;

            // Sync Job Status
            database.ref(`annotations/${sessionId}/jobStatus`).on('value', (snapshot) => {
                const status = snapshot.val();
                updateJobStatusUI(status === 'processing');
            });

            const markersRef = database.ref(`annotations/${sessionId}/markers`);

            const hasExistingData = Object.keys(annotations).length > 0;

            if (!hasExistingData) {
                document.querySelectorAll('.marker').forEach(el => el.remove());
                document.querySelectorAll('.arrow-line').forEach(el => el.remove());
                if (annotationsCards) {
                    annotationsCards.innerHTML = '';
                } else {
                    annotationsList.innerHTML = '';
                }
                annotations = {};
            }

            let isInitialLoad = !hasExistingData;

            markersRef.on('child_added', (snapshot) => {
                const marker = { id: snapshot.key, ...snapshot.val() };
                markerCounter = Math.max(markerCounter, (marker.number || 0) + 1);
                if (annotations[marker.id]) return;
                annotations[marker.id] = marker;

                if (!isInitialLoad) {
                    const emptyEl = annotationsCards ? annotationsCards.querySelector('.empty-state') : null;
                    if (emptyEl) emptyEl.remove();
                    if (jobStatusBanner) jobStatusBanner.classList.remove('hidden');

                    if (!marker.page || marker.page === currentPage) {
                        renderMarker(marker);
                    }
                    renderAnnotationCard(marker);
                    annotationCount.textContent = Object.keys(annotations).length;
                    checkCompletionStatus();
                    setTimeout(renderArrows, 100);
                }
            });

            markersRef.once('value', (snapshot) => {
                if (isInitialLoad) {
                    isInitialLoad = false;

                    if (Object.keys(annotations).length === 0) {
                        const emptyHtml = `
                            <div class="empty-state">
                                <i class="fa-regular fa-circle-dot"></i>
                                <p><strong>ยังไม่มีจุดแก้ไข</strong></p>
                                <p>คลิกปุ่ม "เพิ่ม" หรือคลิกที่ไฟล์ด้านซ้าย</p>
                            </div>
                        `;
                        if (annotationsCards) {
                            annotationsCards.innerHTML = emptyHtml;
                        } else {
                            annotationsList.innerHTML = emptyHtml;
                        }
                        if (jobStatusBanner) jobStatusBanner.classList.add('hidden');
                        annotationCount.textContent = '0';
                        checkCompletionStatus();
                        return;
                    }

                    if (jobStatusBanner) jobStatusBanner.classList.remove('hidden');

                    const sorted = Object.values(annotations).sort((a, b) => a.number - b.number);
                    sorted.forEach(marker => {
                        if (!marker.page || marker.page === currentPage) {
                            renderMarker(marker);
                        }
                        renderAnnotationCard(marker);
                    });
                    annotationCount.textContent = sorted.length;
                    checkCompletionStatus();
                    setTimeout(renderArrows, 100);
                } else {
                    // Reconcile: remove markers deleted by others while page was loading
                    const fbIds = new Set(Object.keys(snapshot.val() || {}));
                    Object.keys(annotations).forEach(id => {
                        if (!fbIds.has(id)) {
                            delete annotations[id];
                            document.querySelector(`.marker[data-id="${id}"]`)?.remove();
                            document.querySelector(`.annotation-card[data-id="${id}"]`)?.remove();
                        }
                    });
                    const count = Object.keys(annotations).length;
                    annotationCount.textContent = count;
                    if (count === 0 && jobStatusBanner) {
                        jobStatusBanner.classList.add('hidden');
                    }
                    markerCounter = Object.values(annotations).reduce((max, m) => Math.max(max, m.number || 0), 0) + 1;
                    checkCompletionStatus();
                }
            });

            markersRef.on('child_changed', (snapshot) => {
                const updated = { id: snapshot.key, ...snapshot.val() };
                annotations[updated.id] = updated;

                const markerEl = document.querySelector(`.marker[data-id="${updated.id}"]`);
                if (markerEl) {
                    markerEl.style.left = updated.x + '%';
                    markerEl.style.top = updated.y + '%';
                    markerEl.style.width = updated.width + '%';
                    markerEl.style.height = updated.height + '%';
                    markerEl.classList.toggle('completed', !!updated.done);
                }

                const card = document.querySelector(`.annotation-card[data-id="${updated.id}"]`);
                if (card) {
                    const textarea = card.querySelector('.annotation-text');
                    if (textarea && document.activeElement !== textarea) {
                        textarea.value = updated.text || '';
                    }
                    card.classList.toggle('completed', !!updated.done);
                    const doneInput = card.querySelector('.done-input');
                    const doneText = card.querySelector('.done-text');
                    if (doneInput) {
                        doneInput.checked = !!updated.done;
                    }
                    if (doneText) {
                        doneText.style.color = updated.done ? 'var(--success)' : 'inherit';
                    }
                }

                checkCompletionStatus();
                renderArrows();
            });

            markersRef.on('child_removed', (snapshot) => {
                const id = snapshot.key;
                delete annotations[id];

                document.querySelector(`.marker[data-id="${id}"]`)?.remove();
                document.querySelector(`.annotation-card[data-id="${id}"]`)?.remove();

                const count = Object.keys(annotations).length;
                annotationCount.textContent = count;
                // Recalculate counter from remaining markers
                markerCounter = Object.values(annotations).reduce((max, m) => Math.max(max, m.number || 0), 0) + 1;
                if (count === 0) {
                    const emptyHtml = `
                        <div class="empty-state">
                            <i class="fa-regular fa-circle-dot"></i>
                            <p><strong>ยังไม่มีจุดแก้ไข</strong></p>
                            <p>คลิกปุ่ม "เพิ่ม" หรือคลิกที่ไฟล์ด้านซ้าย</p>
                        </div>
                    `;
                    if (annotationsCards) {
                        annotationsCards.innerHTML = emptyHtml;
                    } else {
                        annotationsList.innerHTML = emptyHtml;
                    }
                    if (jobStatusBanner) jobStatusBanner.classList.add('hidden');
                }
                checkCompletionStatus();
                renderArrows();
            });
        }

        // ===== CLEANUP EXPIRED SESSIONS =====
        async function cleanupExpiredSessions() {
            // ไม่โหลดทั้ง database บน client เพื่อป้องกันการช้าและค้าง
            // การหมดอายุของ session ถูกตรวจสอบและลบเป็นราย session ใน loadExistingSession และ startExpiryCountdown อยู่แล้ว
            return;
        }

        // ===== FIREBASE SYNC =====
        // Redraw arrows when tab becomes visible
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                renderArrows();
            }
        });
    </script>
</body>
</html>
