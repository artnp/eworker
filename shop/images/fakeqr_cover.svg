<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Grid overlay subtle -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Central Card -->
  <rect x="70" y="55" width="260" height="260" rx="24" fill="#ffffff" fill-opacity="0.96" filter="url(#glow)" />

  <!-- QR Pattern Corners -->
  <!-- Top Left -->
  <rect x="96" y="81" width="56" height="56" rx="10" fill="#0f172a" />
  <rect x="108" y="93" width="32" height="32" rx="6" fill="#ffffff" />
  <rect x="116" y="101" width="16" height="16" rx="3" fill="#0284c7" />

  <!-- Top Right -->
  <rect x="248" y="81" width="56" height="56" rx="10" fill="#0f172a" />
  <rect x="260" y="93" width="32" height="32" rx="6" fill="#ffffff" />
  <rect x="268" y="101" width="16" height="16" rx="3" fill="#0284c7" />

  <!-- Bottom Left -->
  <rect x="96" y="233" width="56" height="56" rx="10" fill="#0f172a" />
  <rect x="108" y="245" width="32" height="32" rx="6" fill="#ffffff" />
  <rect x="116" y="253" width="16" height="16" rx="3" fill="#0284c7" />

  <!-- Randomized Obfuscated Noise Matrix -->
  <rect x="170" y="86" width="16" height="16" rx="3" fill="#0f172a" />
  <rect x="200" y="86" width="16" height="16" rx="3" fill="#334155" />
  <rect x="170" y="116" width="16" height="16" rx="3" fill="#334155" />
  <rect x="214" y="116" width="16" height="16" rx="3" fill="#0f172a" />

  <rect x="164" y="152" width="72" height="72" rx="16" fill="url(#qrGrad)" />
  <!-- Security Shield in Center -->
  <path d="M200 166 L222 176 V198 C222 212 212 224 200 228 C188 224 178 212 178 198 V176 Z" fill="#ffffff" />
  <path d="M194 196 L198 200 L207 190" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Noise blocks -->
  <rect x="250" y="160" width="16" height="16" rx="3" fill="#0f172a" />
  <rect x="280" y="180" width="16" height="16" rx="3" fill="#334155" />
  <rect x="250" y="210" width="16" height="16" rx="3" fill="#0f172a" />
  <rect x="280" y="240" width="16" height="16" rx="3" fill="#0284c7" />

  <rect x="170" y="240" width="16" height="16" rx="3" fill="#0f172a" />
  <rect x="200" y="254" width="16" height="16" rx="3" fill="#334155" />

  <!-- Cross out scan slash (anti-scan indicator) -->
  <circle cx="312" cy="74" r="24" fill="#ef4444" />
  <line x1="298" y1="74" x2="326" y2="74" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Badge Banner -->
  <rect x="50" y="336" width="300" height="42" rx="12" fill="#0284c7" />
  <text x="200" y="363" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    FAKE QR • สแกนไม่ติด 100%
  </text>
</svg>
