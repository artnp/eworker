<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A20" />
      <stop offset="60%" stop-color="#0B0E11" />
      <stop offset="100%" stop-color="#1E2329" />
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="40%" stop-color="#EA3943" />
      <stop offset="100%" stop-color="#C01625" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD535" />
      <stop offset="50%" stop-color="#F0B90B" />
      <stop offset="100%" stop-color="#D99B00" />
    </linearGradient>

    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#F0B90B" />
      <stop offset="100%" stop-color="#C99400" />
    </linearGradient>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.05" stroke="#F0B90B" stroke-width="1.5">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Ambient Glow Behind Box -->
  <circle cx="200" cy="180" r="110" fill="#EA3943" opacity="0.22" filter="url(#goldGlow)" />
  <circle cx="200" cy="170" r="70" fill="#F0B90B" opacity="0.2" filter="url(#goldGlow)" />

  <!-- Shadow Base -->
  <ellipse cx="200" cy="285" rx="100" ry="20" fill="#000000" opacity="0.45" />

  <!-- Falling Crypto Coins Left & Right -->
  <g transform="translate(68, 140) rotate(-18)">
    <circle cx="0" cy="0" r="22" fill="url(#goldGrad)" filter="url(#softShadow)" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#D99B00" stroke-width="2" />
    <text x="0" y="7" font-size="18" font-family="'Inter', sans-serif" font-weight="900" fill="#784E00" text-anchor="middle">₿</text>
  </g>
  <g transform="translate(332, 175) rotate(22)">
    <circle cx="0" cy="0" r="24" fill="url(#goldGrad)" filter="url(#softShadow)" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#D99B00" stroke-width="2" />
    <text x="0" y="7" font-size="16" font-family="'Inter', sans-serif" font-weight="900" fill="#784E00" text-anchor="middle">₮</text>
  </g>

  <!-- RED PACKET GIFT BOX (Main Container) -->
  <!-- Box Base -->
  <rect x="120" y="160" width="160" height="115" rx="16" fill="url(#boxGrad)" filter="url(#softShadow)" />

  <!-- Box Base Inner Shadow / Gradient Accent -->
  <path d="M 120 255 Q 200 278 280 255 L 280 260 Q 280 275 264 275 L 136 275 Q 120 275 120 260 Z" fill="#990E1B" opacity="0.6" />

  <!-- Box Lid (Top Cover) -->
  <rect x="110" y="130" width="180" height="42" rx="12" fill="url(#boxGrad)" filter="url(#softShadow)" />
  <rect x="110" y="166" width="180" height="6" fill="#880C17" opacity="0.5" />

  <!-- Vertical Golden Ribbon -->
  <rect x="184" y="130" width="32" height="145" fill="url(#goldRibbon)" />
  <rect x="187" y="130" width="26" height="145" fill="none" stroke="#FFF5B8" stroke-width="1" opacity="0.6" />

  <!-- Horizontal Golden Ribbon on Lid -->
  <rect x="110" y="142" width="180" height="18" fill="url(#goldRibbon)" opacity="0.9" />

  <!-- Ribbon Bow (Top Knot) -->
  <!-- Left Loop -->
  <path d="M 190 134 C 160 100, 140 105, 150 126 C 158 140, 185 136, 192 134 Z" fill="url(#goldRibbon)" filter="url(#softShadow)" />
  <!-- Right Loop -->
  <path d="M 210 134 C 240 100, 260 105, 250 126 C 242 140, 215 136, 208 134 Z" fill="url(#goldRibbon)" filter="url(#softShadow)" />
  <!-- Center Knot -->
  <circle cx="200" cy="132" r="13" fill="url(#goldGrad)" filter="url(#softShadow)" />
  <circle cx="200" cy="132" r="8" fill="#FFED85" />

  <!-- Binance Diamond Emblem on Front Center -->
  <g transform="translate(200, 215)">
    <circle cx="0" cy="0" r="24" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    <!-- Mini Diamond Binance Style -->
    <path d="M 0 -13 L 9 0 L 0 13 L -9 0 Z" fill="#181A20" />
    <path d="M 0 -7 L 5 0 L 0 7 L -5 0 Z" fill="#F0B90B" />
  </g>

  <!-- Sparkles -->
  <g fill="#FFF494">
    <path d="M 125 105 Q 125 115 135 115 Q 125 115 125 125 Q 125 115 115 115 Q 125 115 125 105 Z" opacity="0.9" />
    <path d="M 275 95 Q 275 103 283 103 Q 275 103 275 111 Q 275 103 267 103 Q 275 103 275 95 Z" opacity="0.85" />
    <circle cx="100" cy="190" r="2.5" opacity="0.7" />
    <circle cx="305" cy="130" r="3" opacity="0.75" />
  </g>

  <!-- Badge / Bottom Title Text -->
  <rect x="65" y="320" width="270" height="46" rx="23" fill="#1E2329" stroke="#F0B90B" stroke-width="1.8" />
  <text x="200" y="342" font-family="'Prompt', 'Inter', sans-serif" font-size="15" font-weight="700" fill="#F0B90B" text-anchor="middle">🧧 BINANCE RED PACKET</text>
  <text x="200" y="357" font-family="'Prompt', 'Inter', sans-serif" font-size="11" font-weight="500" fill="#EAECEF" text-anchor="middle">แจกเหรียญฟรีทุก 1 ชั่วโมง (15 โค้ด)</text>
</svg>
