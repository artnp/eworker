<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint / Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- PDF Document Mockup -->
  <g filter="url(#cardShadow)">
    <rect x="75" y="44" width="250" height="280" rx="14" fill="url(#paperGrad)" />
    <!-- Paper fold corner -->
    <path d="M301 44 L325 68 H307 A6 6 0 0 1 301 62 Z" fill="#cbd5e1" opacity="0.6" />
  </g>

  <!-- Document Header Bar & PDF badge -->
  <rect x="96" y="64" width="46" height="20" rx="6" fill="url(#pdfGrad)" />
  <text x="119" y="78" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="10" font-weight="800" text-anchor="middle">PDF</text>
  <rect x="150" y="68" width="80" height="10" rx="5" fill="#e2e8f0" />
  <rect x="238" y="70" width="40" height="7" rx="3.5" fill="#f1f5f9" />

  <!-- Mockup Document Lines -->
  <rect x="96" y="100" width="208" height="8" rx="4" fill="#e2e8f0" />
  <rect x="96" y="118" width="180" height="8" rx="4" fill="#e2e8f0" />
  <rect x="96" y="136" width="195" height="8" rx="4" fill="#e2e8f0" />
  <rect x="96" y="154" width="140" height="8" rx="4" fill="#e2e8f0" />

  <rect x="96" y="240" width="208" height="8" rx="4" fill="#e2e8f0" />
  <rect x="96" y="258" width="165" height="8" rx="4" fill="#e2e8f0" />
  <rect x="96" y="276" width="190" height="8" rx="4" fill="#e2e8f0" />

  <!-- Marker Target Box (Red Highlight with Glow) -->
  <g filter="url(#glowRed)">
    <rect x="115" y="176" width="170" height="52" rx="8" fill="#fee2e2" fill-opacity="0.6" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 3" />
  </g>

  <!-- Corner Handles for Marker Box -->
  <circle cx="115" cy="176" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <circle cx="285" cy="176" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <circle cx="115" cy="228" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <circle cx="285" cy="228" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />

  <!-- Marker Point Tag #1 -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="166" width="24" height="20" rx="6" fill="#ef4444" />
    <text x="112" y="180" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="11" font-weight="800" text-anchor="middle">#1</text>
  </g>

  <!-- Mockup text inside marker -->
  <rect x="130" y="190" width="138" height="8" rx="4" fill="#fca5a5" />
  <rect x="130" y="206" width="105" height="8" rx="4" fill="#fca5a5" />

  <!-- Comment Bubble / Annotation Tag -->
  <g filter="url(#cardShadow)">
    <path d="M190 220 L205 236 L215 220 Z" fill="#1e293b" />
    <rect x="155" y="234" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Pin icon -->
    <circle cx="172" cy="251" r="5" fill="#ef4444" />
    <text x="186" y="256" fill="#f8fafc" font-family="'Prompt', sans-serif" font-size="12" font-weight="600">มาร์คจุดแก้เอกสาร</text>
  </g>

  <!-- Bottom Floating Badge / Price Pill -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="342" width="220" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="112" cy="361" r="11" fill="#0284c7" />
    <path d="M108 361 L111 364 L117 357" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="130" y="366" fill="#f8fafc" font-family="'Prompt', sans-serif" font-size="13" font-weight="700">ชี้จุดส่งแก้ • ฿5 / ครั้ง</text>
  </g>
</svg>
