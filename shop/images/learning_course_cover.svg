<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Certificate Paper Gradient -->
    <linearGradient id="certPaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Mortarboard Cap Gradients -->
    <linearGradient id="capTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="capBandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="capShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="180" r="160" fill="#4338ca" opacity="0.15" />
  <circle cx="100" cy="90" r="80" fill="#f59e0b" opacity="0.08" />

  <!-- Background Decorative Grid & Sparks -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.2">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
  </g>

  <!-- Sparkles / Stars -->
  <path d="M 60 70 Q 60 85 45 85 Q 60 85 60 100 Q 60 85 75 85 Q 60 85 60 70 Z" fill="#fbbf24" opacity="0.4" />
  <path d="M 345 90 Q 345 100 335 100 Q 345 100 345 110 Q 345 100 355 100 Q 345 100 345 90 Z" fill="#fbbf24" opacity="0.5" />
  <path d="M 70 300 Q 70 308 62 308 Q 70 308 70 316 Q 70 308 78 308 Q 70 308 70 300 Z" fill="#60a5fa" opacity="0.4" />
  <path d="M 330 260 Q 330 270 320 270 Q 330 270 330 280 Q 330 270 340 270 Q 330 270 330 260 Z" fill="#fbbf24" opacity="0.45" />

  <!-- ========================================== -->
  <!-- CERTIFICATE DIPLOMA (ใบประกาศนียบัตร)      -->
  <!-- ========================================== -->
  <g filter="url(#cardShadow)">
    <!-- Main Certificate Parchment -->
    <rect x="68" y="75" width="264" height="252" rx="16" fill="url(#certPaperGrad)" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Ornate Double Border in Gold -->
    <rect x="78" y="85" width="244" height="232" rx="11" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="83" y="90" width="234" height="222" rx="8" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2" opacity="0.75" />

    <!-- Corner Decorative Accents -->
    <g fill="none" stroke="url(#goldGrad)" stroke-width="2">
      <!-- Top-Left -->
      <path d="M 88 102 L 88 88 L 102 88" />
      <circle cx="94" cy="94" r="2.5" fill="#f59e0b" stroke="none" />
      <!-- Top-Right -->
      <path d="M 312 102 L 312 88 L 298 88" />
      <circle cx="306" cy="94" r="2.5" fill="#f59e0b" stroke="none" />
      <!-- Bottom-Left -->
      <path d="M 88 298 L 88 312 L 102 312" />
      <circle cx="94" cy="306" r="2.5" fill="#f59e0b" stroke="none" />
      <!-- Bottom-Right -->
      <path d="M 312 298 L 312 312 L 298 312" />
      <circle cx="306" cy="306" r="2.5" fill="#f59e0b" stroke="none" />
    </g>

    <!-- Certificate Header Emblem / Laurels -->
    <g transform="translate(200, 126)">
      <!-- Laurel Leaves Left -->
      <path d="M -8 2 Q -22 -6 -24 -20 Q -14 -12 -6 -4" fill="#d97706" opacity="0.8" />
      <path d="M -5 6 Q -18 3 -24 14 Q -16 8 -4 4" fill="#d97706" opacity="0.8" />
      <!-- Laurel Leaves Right -->
      <path d="M 8 2 Q 22 -6 24 -20 Q 14 -12 6 -4" fill="#d97706" opacity="0.8" />
      <path d="M 5 6 Q 18 3 24 14 Q 16 8 4 4" fill="#d97706" opacity="0.8" />
      <!-- Center Star -->
      <path d="M 0 -12 L 3 -3 L 12 -3 L 5 3 L 7 12 L 0 7 L -7 12 L -5 3 L -12 -3 L -3 -3 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Certificate Heading Typography -->
    <text x="200" y="152" fill="#0f172a" font-family="'Prompt', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="2">CERTIFICATE</text>
    <text x="200" y="165" fill="#b45309" font-family="'Prompt', sans-serif" font-size="7" font-weight="700" text-anchor="middle" letter-spacing="1">OF EXCELLENCE &amp; MASTERY</text>

    <!-- Certificate Decorative Divider -->
    <path d="M 140 174 L 260 174" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="200" cy="174" r="3" fill="#f59e0b" />

    <!-- Mockup Course Description Lines on Certificate -->
    <rect x="110" y="186" width="180" height="6.5" rx="3.25" fill="#cbd5e1" opacity="0.8" />
    <rect x="122" y="198" width="156" height="5.5" rx="2.75" fill="#e2e8f0" />
    <rect x="135" y="209" width="130" height="5" rx="2.5" fill="#e2e8f0" />

    <!-- Recipient Highlight Line -->
    <rect x="118" y="226" width="164" height="13" rx="6.5" fill="#fef3c7" stroke="#fde047" stroke-width="1" />
    <text x="200" y="236" fill="#92400e" font-family="'Prompt', sans-serif" font-size="8" font-weight="700" text-anchor="middle">🎓 ทักษะความรู้ออนไลน์ • จบหลักสูตร</text>

    <!-- Signature Lines & Date -->
    <g opacity="0.75">
      <line x1="110" y1="272" x2="165" y2="272" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 118 268 Q 128 260 138 270 Q 148 264 158 268" fill="none" stroke="#64748b" stroke-width="1.2" />
      <text x="137" y="282" fill="#64748b" font-family="'Prompt', sans-serif" font-size="6.5" text-anchor="middle">AUTHORIZED</text>

      <line x1="185" y1="272" x2="225" y2="272" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <text x="205" y="282" fill="#64748b" font-family="'Prompt', sans-serif" font-size="6.5" text-anchor="middle">VERIFIED</text>
    </g>

    <!-- Golden Wax Seal & Red Ribbon (Bottom Right of Certificate) -->
    <g transform="translate(268, 268)" filter="url(#goldGlow)">
      <!-- Ribbon Tails -->
      <path d="M -6 10 L -12 36 L -2 30 L 8 36 L 4 10 Z" fill="url(#ribbonGrad)" opacity="0.9" />
      <path d="M 6 10 L 14 34 L 6 28 L -2 34 L 0 10 Z" fill="#b91c1c" opacity="0.85" />
      <!-- Golden Seal Badge -->
      <circle cx="0" cy="8" r="19" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1" />
      <!-- Starburst Teeth -->
      <circle cx="0" cy="8" r="15" fill="#fef08a" stroke="#d97706" stroke-width="1" stroke-dasharray="2 1.5" />
      <!-- Inner Stamp Icon -->
      <circle cx="0" cy="8" r="12" fill="url(#goldGrad)" />
      <!-- Ribbon Star -->
      <path d="M 0 3 L 2 7 L 6 7 L 3 10 L 4 14 L 0 11.5 L -4 14 L -3 10 L -6 7 L -2 7 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- GRADUATION CAP (หมวกรับปริญญา สวมครอบบนใบประกาศ)         -->
  <!-- ======================================================== -->
  <g filter="url(#capShadow)" transform="translate(142, 68) rotate(-11)">
    <!-- Cap Skull Base / Headband under the board -->
    <ellipse cx="0" cy="30" rx="36" ry="12" fill="url(#capBandGrad)" />
    <path d="M -36 30 C -36 44 36 44 36 30 L 36 24 C 36 38 -36 38 -36 24 Z" fill="#0f172a" />
    <path d="M -36 24 C -36 34 36 34 36 24" stroke="#334155" stroke-width="1.5" fill="none" />

    <!-- Main Diamond Mortarboard Top -->
    <!-- Top 3D Edge -->
    <path d="M 0 -10 L 78 16 L 0 42 L -78 16 Z" fill="url(#capTopGrad)" stroke="#475569" stroke-width="1.5" />
    <!-- Thickness Bottom Rim for 3D Depth -->
    <path d="M -78 16 L 0 42 L 78 16 L 78 20 L 0 46 L -78 20 Z" fill="#090d16" />

    <!-- Center Button on Mortarboard -->
    <ellipse cx="0" cy="16" rx="6" ry="4" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.8" />

    <!-- Golden Tassel (พู่หมวกรับปริญญาสีทอง) -->
    <!-- Ribbon String draping across and down -->
    <path d="M 0 16 Q 30 18 52 28 Q 66 36 68 56" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 0 16 Q 30 18 52 28 Q 66 36 68 56" fill="none" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" />

    <!-- Tassel Ring / Band -->
    <circle cx="68" cy="57" r="3.5" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.6" />

    <!-- Tassel Fringe Bristles -->
    <path d="M 65 59 L 60 84 C 65 86 73 86 76 84 L 71 59 Z" fill="url(#goldGrad)" />
    <!-- Tassel Hair lines -->
    <line x1="64" y1="62" x2="62" y2="83" stroke="#d97706" stroke-width="0.8" />
    <line x1="68" y1="62" x2="68" y2="85" stroke="#fef08a" stroke-width="1" />
    <line x1="72" y1="62" x2="74" y2="83" stroke="#b45309" stroke-width="0.8" />
  </g>

  <!-- ========================================== -->
  <!-- BOTTOM FLOATING BADGE (ทักษะเรียนรู้)      -->
  <!-- ========================================== -->
  <g filter="url(#cardShadow)">
    <rect x="75" y="342" width="250" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Graduation Icon Circle -->
    <circle cx="98" cy="361" r="12" fill="#0284c7" />
    <text x="98" y="365" fill="#ffffff" font-size="13" text-anchor="middle">🎓</text>
    <text x="122" y="366" fill="#f8fafc" font-family="'Prompt', sans-serif" font-size="12.5" font-weight="700">คอร์สเรียน • ทักษะเรียนรู้</text>
  </g>
</svg>

