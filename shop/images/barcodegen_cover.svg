<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="25%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f87171" stop-opacity="1" />
      <stop offset="75%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="greenBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />

  <!-- Technical Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1.2">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Stacked Consecutive Pages (Showing Sequential Processing) -->
  <g opacity="0.4" transform="translate(18, -12)">
    <rect x="70" y="50" width="225" height="230" rx="14" fill="#334155" stroke="#475569" stroke-width="1.5" />
  </g>
  <g opacity="0.7" transform="translate(9, -6)">
    <rect x="70" y="50" width="225" height="230" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  </g>

  <!-- Main Active Document Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="50" width="260" height="255" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Top Doc Header Bar -->
    <rect x="70" y="50" width="260" height="42" rx="16" fill="#f1f5f9" />
    <rect x="70" y="76" width="260" height="16" fill="#f1f5f9" />
    <line x1="70" y1="92" x2="330" y2="92" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Header elements -->
    <circle cx="92" cy="71" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="106" cy="71" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="120" cy="71" r="5" fill="#10b981" opacity="0.8" />
    
    <rect x="145" y="65" width="85" height="12" rx="6" fill="#cbd5e1" />
    <rect x="272" y="64" width="44" height="14" rx="7" fill="url(#accentGrad)" />
    <text x="294" y="74" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">PDF/IMG</text>
    
    <!-- Document content placeholder lines -->
    <rect x="92" y="110" width="110" height="8" rx="4" fill="#cbd5e1" />
    <rect x="92" y="125" width="70" height="6" rx="3" fill="#e2e8f0" />
    <rect x="92" y="137" width="130" height="6" rx="3" fill="#e2e8f0" />
    
    <!-- Barcode Container Box (The Target Stamped Barcode) -->
    <rect x="92" y="160" width="216" height="115" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3" />
    
    <!-- Selection Corner Pins -->
    <circle cx="92" cy="160" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="308" cy="160" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="92" cy="275" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="308" cy="275" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Barcode Bars -->
    <g fill="#0f172a">
      <rect x="108" y="174" width="4" height="66" />
      <rect x="114" y="174" width="2" height="66" />
      <rect x="118" y="174" width="6" height="66" />
      <rect x="126" y="174" width="3" height="66" />
      <rect x="132" y="174" width="5" height="66" />
      <rect x="140" y="174" width="2" height="66" />
      <rect x="144" y="174" width="7" height="66" />
      <rect x="154" y="174" width="3" height="66" />
      <rect x="160" y="174" width="2" height="66" />
      <rect x="164" y="174" width="8" height="66" />
      <rect x="175" y="174" width="4" height="66" />
      <rect x="182" y="174" width="3" height="66" />
      <rect x="187" y="174" width="7" height="66" />
      <rect x="197" y="174" width="2" height="66" />
      <rect x="201" y="174" width="5" height="66" />
      <rect x="208" y="174" width="8" height="66" />
      <rect x="219" y="174" width="3" height="66" />
      <rect x="224" y="174" width="5" height="66" />
      <rect x="231" y="174" width="2" height="66" />
      <rect x="235" y="174" width="7" height="66" />
      <rect x="244" y="174" width="4" height="66" />
      <rect x="251" y="174" width="6" height="66" />
      <rect x="260" y="174" width="2" height="66" />
      <rect x="264" y="174" width="5" height="66" />
      <rect x="272" y="174" width="3" height="66" />
      <rect x="277" y="174" width="7" height="66" />
      <rect x="287" y="174" width="3" height="66" />
    </g>
    
    <!-- Barcode Text Display -->
    <text x="200" y="258" fill="#1e293b" font-family="'Outfit', 'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">EW-88492001</text>
    
    <!-- Red Laser Scanner Beam -->
    <g filter="url(#laserGlow)">
      <line x1="88" y1="205" x2="312" y2="205" stroke="url(#laserGrad)" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Sequential Counter Pill (Upper Left Floating) -->
  <g filter="url(#shadow)">
    <rect x="36" y="140" width="98" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="50" y="161" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="800">#001 → #999</text>
  </g>

  <!-- Floating Green Verified / 100% Scannable Badge -->
  <g filter="url(#badgeGlow)">
    <rect x="210" y="280" width="154" height="34" rx="17" fill="url(#greenBadge)" stroke="#a7f3d0" stroke-width="1.5" />
    <circle cx="227" cy="297" r="7" fill="#ffffff" />
    <path d="M224 297 L226 299 L231 294" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="240" y="302" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="11.5" font-weight="700">สแกนติด 100%</text>
  </g>

  <!-- Bottom Title & Price Bar -->
  <g transform="translate(0, 325)">
    <!-- Label -->
    <text x="200" y="24" fill="#ffffff" font-family="'Prompt', 'Outfit', sans-serif" font-size="17" font-weight="700" text-anchor="middle">
      สร้างบาร์โค้ดลงภาพ/PDF เรียงรหัส
    </text>
    <text x="200" y="44" fill="#94a3b8" font-family="'Prompt', sans-serif" font-size="11.5" text-anchor="middle">
      กำหนดขนาดตำแหน่ง • สแกนเช็คตรงตามรหัส • ค่าบริการ 30 บาท
    </text>
  </g>
</svg>

