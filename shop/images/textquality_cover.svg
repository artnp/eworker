<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tqBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="tqCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="tqBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="tqShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#tqBgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
  </g>

  <!-- Back Sheet (Original Clean Doc) -->
  <rect x="75" y="70" width="220" height="260" rx="10" fill="#ffffff" opacity="0.15" transform="rotate(-6 185 200)" />

  <!-- Foreground Sheet (Degraded / Low Quality Doc) -->
  <g filter="url(#tqShadow)" transform="rotate(2 195 200)">
    <rect x="85" y="65" width="220" height="260" rx="8" fill="url(#tqCardGrad)" />
    
    <!-- Header bar -->
    <rect x="110" y="95" width="130" height="12" rx="4" fill="#64748b" opacity="0.7" />
    <rect x="110" y="115" width="70" height="7" rx="3.5" fill="#94a3b8" opacity="0.6" />

    <!-- Pixelated text blocks / mosaic grid -->
    <g fill="#475569" opacity="0.75">
      <!-- Row 1 -->
      <rect x="110" y="140" width="10" height="10" />
      <rect x="122" y="140" width="10" height="10" fill="#64748b" />
      <rect x="134" y="140" width="10" height="10" />
      <rect x="146" y="140" width="10" height="10" fill="#94a3b8" />
      <rect x="158" y="140" width="10" height="10" />
      <rect x="170" y="140" width="10" height="10" fill="#64748b" />
      <rect x="182" y="140" width="10" height="10" />
      <rect x="194" y="140" width="10" height="10" fill="#94a3b8" />
      <rect x="206" y="140" width="10" height="10" />

      <!-- Row 2 -->
      <rect x="110" y="160" width="10" height="10" fill="#94a3b8" />
      <rect x="122" y="160" width="10" height="10" />
      <rect x="134" y="160" width="10" height="10" fill="#64748b" />
      <rect x="146" y="160" width="10" height="10" />
      <rect x="158" y="160" width="10" height="10" fill="#94a3b8" />
      <rect x="170" y="160" width="10" height="10" />
      <rect x="182" y="160" width="10" height="10" fill="#64748b" />
      <rect x="194" y="160" width="10" height="10" />
      <rect x="206" y="160" width="10" height="10" fill="#94a3b8" />
      <rect x="218" y="160" width="10" height="10" />

      <!-- Row 3 -->
      <rect x="110" y="180" width="10" height="10" />
      <rect x="122" y="180" width="10" height="10" fill="#64748b" />
      <rect x="134" y="180" width="10" height="10" />
      <rect x="146" y="180" width="10" height="10" fill="#94a3b8" />
      <rect x="158" y="180" width="10" height="10" />
      <rect x="170" y="180" width="10" height="10" fill="#64748b" />
      <rect x="182" y="180" width="10" height="10" />
      <rect x="194" y="180" width="10" height="10" fill="#94a3b8" />

      <!-- Row 4 -->
      <rect x="110" y="200" width="10" height="10" fill="#64748b" />
      <rect x="122" y="200" width="10" height="10" fill="#94a3b8" />
      <rect x="134" y="200" width="10" height="10" />
      <rect x="146" y="200" width="10" height="10" fill="#64748b" />
      <rect x="158" y="200" width="10" height="10" />
      <rect x="170" y="200" width="10" height="10" fill="#94a3b8" />
      <rect x="182" y="200" width="10" height="10" />
      <rect x="194" y="200" width="10" height="10" fill="#64748b" />
      <rect x="206" y="200" width="10" height="10" />
      <rect x="218" y="200" width="10" height="10" fill="#94a3b8" />
    </g>

    <!-- Signature line pixelated -->
    <line x1="180" y1="280" x2="270" y2="280" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" />
  </g>

  <!-- Price / Badge -->
  <g filter="url(#tqShadow)">
    <rect x="240" y="45" width="125" height="42" rx="21" fill="url(#tqBadgeGrad)" />
    <text x="302" y="72" font-family="'Prompt', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">
      ฿20 / ครั้ง
    </text>
  </g>

  <!-- Bottom Title Tag -->
  <g filter="url(#tqShadow)">
    <rect x="40" y="325" width="320" height="46" rx="14" fill="#0f172a" fill-opacity="0.92" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="200" y="354" font-family="'Prompt', sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">
      📉 แปลงข้อความให้พิกเซลคุณภาพต่ำ
    </text>
  </g>
</svg>

