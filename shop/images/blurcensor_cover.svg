<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bcBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bcCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="bcAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bcBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="bcCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="bcGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#06b6d4" flood-opacity="0.6" />
    </filter>
    <filter id="bcBlurSim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bcBgGrad)" />

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Decorative Document Card in Center -->
  <g filter="url(#bcCardShadow)">
    <rect x="75" y="60" width="250" height="280" rx="14" fill="url(#bcCardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Top Doc Header Bar -->
    <rect x="95" y="85" width="45" height="18" rx="4" fill="#ef4444" opacity="0.9" />
    <text x="117" y="98" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="900" text-anchor="middle">PDF</text>
    
    <rect x="150" y="88" width="110" height="12" rx="3" fill="#64748b" opacity="0.4" />
    
    <!-- Normal Text Lines -->
    <rect x="95" y="120" width="140" height="8" rx="3" fill="#94a3b8" opacity="0.5" />
    <rect x="95" y="136" width="210" height="8" rx="3" fill="#cbd5e1" opacity="0.7" />
    <rect x="95" y="152" width="180" height="8" rx="3" fill="#cbd5e1" opacity="0.7" />
    
    <!-- Censored Blackout Bar -->
    <rect x="95" y="174" width="150" height="20" rx="4" fill="#0f172a" />
    <text x="170" y="188" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="2" text-anchor="middle">REDACTED</text>

    <!-- Simulated Blur Box with Selection Ring -->
    <g filter="url(#bcBlurSim)">
      <rect x="95" y="210" width="160" height="22" rx="2" fill="#0284c7" opacity="0.6" />
      <rect x="105" y="215" width="140" height="12" fill="#0f172a" />
    </g>

    <!-- Pixelate Mosaic Simulation -->
    <g transform="translate(95, 246)">
      <!-- Pixel grid -->
      <rect x="0" y="0" width="12" height="12" fill="#334155" />
      <rect x="12" y="0" width="12" height="12" fill="#475569" />
      <rect x="24" y="0" width="12" height="12" fill="#1e293b" />
      <rect x="36" y="0" width="12" height="12" fill="#64748b" />
      <rect x="48" y="0" width="12" height="12" fill="#334155" />
      <rect x="60" y="0" width="12" height="12" fill="#0f172a" />
      <rect x="72" y="0" width="12" height="12" fill="#475569" />
      <rect x="84" y="0" width="12" height="12" fill="#1e293b" />
      <rect x="96" y="0" width="12" height="12" fill="#334155" />
      <rect x="108" y="0" width="12" height="12" fill="#64748b" />

      <rect x="0" y="12" width="12" height="12" fill="#64748b" />
      <rect x="12" y="12" width="12" height="12" fill="#1e293b" />
      <rect x="24" y="12" width="12" height="12" fill="#334155" />
      <rect x="36" y="12" width="12" height="12" fill="#0f172a" />
      <rect x="48" y="12" width="12" height="12" fill="#475569" />
      <rect x="60" y="12" width="12" height="12" fill="#334155" />
      <rect x="72" y="12" width="12" height="12" fill="#1e293b" />
      <rect x="84" y="12" width="12" height="12" fill="#64748b" />
      <rect x="96" y="12" width="12" height="12" fill="#475569" />
      <rect x="108" y="12" width="12" height="12" fill="#334155" />
    </g>

    <!-- Interactive Active Selection Bounding Box with Handles -->
    <rect x="90" y="205" width="170" height="32" rx="3" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 3" filter="url(#bcGlowCyan)" />
    <!-- Handles -->
    <circle cx="90" cy="205" r="4.5" fill="#ffffff" stroke="#06b6d4" stroke-width="2" />
    <circle cx="260" cy="205" r="4.5" fill="#ffffff" stroke="#06b6d4" stroke-width="2" />
    <circle cx="90" cy="237" r="4.5" fill="#ffffff" stroke="#06b6d4" stroke-width="2" />
    <circle cx="260" cy="237" r="4.5" fill="#ffffff" stroke="#06b6d4" stroke-width="2" />
    
    <!-- Normal bottom lines -->
    <rect x="95" y="286" width="210" height="8" rx="3" fill="#cbd5e1" opacity="0.6" />
    <rect x="95" y="302" width="140" height="8" rx="3" fill="#cbd5e1" opacity="0.6" />
  </g>

  <!-- Floating Badge: ฟรี 100% Free -->
  <g transform="translate(235, 45)">
    <rect width="115" height="34" rx="17" fill="url(#bcBadgeGrad)" filter="url(#bcCardShadow)" />
    <text x="57" y="22" fill="#ffffff" font-family="'Prompt', 'Outfit', sans-serif" font-size="13" font-weight="800" text-anchor="middle">🎁 ฟรี (FREE)</text>
  </g>

  <!-- Floating Tool Pill: BLUR AND CENSOR -->
  <g transform="translate(35, 340)">
    <rect width="165" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#bcCardShadow)" />
    <circle cx="22" cy="18" r="6" fill="#06b6d4" />
    <text x="36" y="23" fill="#f8fafc" font-family="'Prompt', 'Outfit', sans-serif" font-size="12" font-weight="700">🔒 เบลอ &amp; Censor</text>
  </g>
</svg>

