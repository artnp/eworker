<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f2e" />
      <stop offset="50%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#162855" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="spiralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.7" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Star field -->
  <g opacity="0.5">
    <circle cx="30" cy="25" r="1.2" fill="#ffffff"/>
    <circle cx="75" cy="60" r="0.8" fill="#ffffff"/>
    <circle cx="120" cy="15" r="1.5" fill="#ffffff"/>
    <circle cx="200" cy="40" r="1.0" fill="#ffffff"/>
    <circle cx="280" cy="20" r="1.2" fill="#ffffff"/>
    <circle cx="350" cy="55" r="0.9" fill="#ffffff"/>
    <circle cx="370" cy="25" r="1.4" fill="#ffffff"/>
    <circle cx="50" cy="90" r="0.7" fill="#ffffff"/>
    <circle cx="160" cy="70" r="1.1" fill="#ffffff"/>
    <circle cx="320" cy="80" r="0.8" fill="#ffffff"/>
    <circle cx="390" cy="100" r="1.0" fill="#ffffff"/>
    <circle cx="20" cy="140" r="1.3" fill="#ffffff"/>
    <circle cx="95" cy="130" r="0.6" fill="#ffffff"/>
    <circle cx="240" cy="110" r="1.0" fill="#ffffff"/>
    <circle cx="310" cy="130" r="1.5" fill="#ffffff"/>
    <circle cx="380" cy="155" r="0.8" fill="#ffffff"/>
    <circle cx="60" cy="180" r="1.1" fill="#ffffff"/>
    <circle cx="145" cy="160" r="0.7" fill="#ffffff"/>
    <circle cx="355" cy="175" r="1.2" fill="#ffffff"/>
    <circle cx="15" cy="200" r="0.9" fill="#ffffff"/>
    <circle cx="385" cy="210" r="0.8" fill="#ffffff"/>
    <circle cx="20" cy="330" r="1.0" fill="#ffffff"/>
    <circle cx="80" cy="360" r="0.7" fill="#ffffff"/>
    <circle cx="360" cy="340" r="1.1" fill="#ffffff"/>
    <circle cx="390" cy="370" r="0.9" fill="#ffffff"/>
    <circle cx="340" cy="385" r="1.3" fill="#ffffff"/>
    <circle cx="130" cy="390" r="0.6" fill="#ffffff"/>
  </g>

  <!-- Golden Ratio Spiral (Fibonacci arcs) -->
  <g fill="none" stroke="url(#goldGrad)" filter="url(#goldGlow)" opacity="0.75">
    <!-- Large outer arc -->
    <path d="M 200 200 m -120 0 a 120 120 0 0 1 120 -120" stroke-width="2.5"/>
    <!-- Medium arc -->
    <path d="M 200 200 m 0 -120 a 74 74 0 0 1 74 74" stroke-width="2.2"/>
    <!-- Smaller arc -->
    <path d="M 274 200 m -74 0 a 46 46 0 0 1 -46 -46" stroke-width="2.0"/>
    <!-- Even smaller -->
    <path d="M 228 154 m 0 46 a 28 28 0 0 1 -28 28" stroke-width="1.8"/>
    <!-- Tiny -->
    <path d="M 200 228 m 0 -28 a 17 17 0 0 1 17 17" stroke-width="1.5"/>
    <!-- Tiniest -->
    <path d="M 217 217 m -17 0 a 10 10 0 0 1 -10 -10" stroke-width="1.2"/>
  </g>

  <!-- Grid dots in phi pattern -->
  <g fill="url(#goldGrad)" opacity="0.35">
    <circle cx="200" cy="200" r="3"/>
    <circle cx="274" cy="200" r="2"/>
    <circle cx="228" cy="154" r="1.8"/>
    <circle cx="200" cy="228" r="1.5"/>
    <circle cx="217" cy="217" r="1.2"/>
    <circle cx="80"  cy="200" r="2.5"/>
    <circle cx="200" cy="80"  r="2.5"/>
  </g>

  <!-- Fibonacci squares (outline) -->
  <g fill="none" stroke="url(#spiralGrad)" stroke-width="1.2" opacity="0.3">
    <rect x="80" y="80" width="240" height="240"/>
    <rect x="80" y="80" width="148" height="148"/>
    <rect x="228" y="80" width="92" height="92"/>
    <rect x="228" y="172" width="57" height="57"/>
    <rect x="80" y="172" width="148" height="57"/>
  </g>

  <!-- Center glow orb -->
  <circle cx="200" cy="200" r="22" fill="url(#goldGrad)" opacity="0.15" />
  <circle cx="200" cy="200" r="10" fill="url(#goldGrad)" opacity="0.55" filter="url(#goldGlow)"/>
  <circle cx="200" cy="200" r="4" fill="#fbbf24"/>

  <!-- Phi symbol -->
  <text x="200" y="290" font-family="Georgia, serif" font-size="60" font-weight="bold"
        fill="url(#goldGrad)" opacity="0.18" text-anchor="middle" filter="url(#softShadow)">φ</text>

  <!-- Icon background pill -->
  <rect x="130" y="42" width="140" height="44" rx="22" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.35)" stroke-width="1.5"/>
  <text x="200" y="71" font-family="sans-serif" font-size="22" text-anchor="middle">🌀⏳✨</text>

  <!-- Title text -->
  <text x="200" y="326" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700"
        fill="#fbbf24" text-anchor="middle" filter="url(#softShadow)">Fractal Time Calculator</text>

  <!-- Sub title -->
  <text x="200" y="348" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400"
        fill="#93c5fd" text-anchor="middle" opacity="0.9">วัฏจักรเวลา · สัดส่วนทองคำ</text>

  <!-- Bottom tag -->
  <rect x="100" y="362" width="200" height="26" rx="13" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.4)" stroke-width="1"/>
  <text x="200" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600"
        fill="#fde68a" text-anchor="middle">by Gregg Braden · ฟรี 🎁</text>
</svg>

