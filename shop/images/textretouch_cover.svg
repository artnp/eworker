<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="cropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Document Sheet -->
  <g filter="url(#shadow)">
    <rect x="70" y="55" width="260" height="290" rx="18" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Document Header / Meta bar -->
    <rect x="95" y="80" width="110" height="12" rx="6" fill="#0f172a" opacity="0.85" />
    <circle cx="295" cy="86" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="312" cy="86" r="6" fill="#10b981" opacity="0.8" />

    <!-- Standard Text Lines (blurred / placeholder document text) -->
    <rect x="95" y="110" width="210" height="8" rx="4" fill="#94a3b8" opacity="0.4" />
    <rect x="95" y="128" width="180" height="8" rx="4" fill="#94a3b8" opacity="0.4" />
    <rect x="95" y="146" width="195" height="8" rx="4" fill="#94a3b8" opacity="0.4" />

    <!-- TARGET RETOUCH ZONE (Highlighted Selection Box) -->
    <rect x="85" y="170" width="230" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" />
    
    <!-- Resize Handles on Retouch Box -->
    <circle cx="85" cy="170" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="315" cy="170" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="85" cy="244" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="315" cy="244" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />

    <!-- Before Text (crossed/muted) -->
    <text x="100" y="196" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-decoration="line-through">ข้อความเดิม 1,500.-</text>

    <!-- After / Retouched Text with sparkles -->
    <text x="100" y="224" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">⚡ แก้ไขใหม่ 3,800.-</text>

    <!-- Crosshair / Retouch Target Icon in the box -->
    <g transform="translate(282, 198)">
      <circle cx="12" cy="12" r="14" fill="#2563eb" opacity="0.15" />
      <circle cx="12" cy="12" r="8" fill="none" stroke="#2563eb" stroke-width="2" />
      <line x1="12" y1="0" x2="12" y2="24" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="12" x2="24" y2="12" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Remaining text lines below -->
    <rect x="95" y="260" width="200" height="8" rx="4" fill="#94a3b8" opacity="0.3" />
    <rect x="95" y="278" width="160" height="8" rx="4" fill="#94a3b8" opacity="0.3" />
    <rect x="95" y="296" width="130" height="8" rx="4" fill="#94a3b8" opacity="0.3" />
    <rect x="95" y="314" width="170" height="8" rx="4" fill="#94a3b8" opacity="0.3" />
  </g>

  <!-- Floating Badge: TEXT RETOUCH / เฉพาะจุด -->
  <g transform="translate(195, 305)" filter="url(#shadow)">
    <rect width="160" height="42" rx="21" fill="url(#accentGrad)" />
    <!-- Hammer / Tool icon -->
    <text x="18" y="27" font-size="18">🔨</text>
    <text x="46" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">ประเมินเฉพาะจุด</text>
  </g>

  <!-- Sparkles -->
  <g fill="#fbbf24" opacity="0.9">
    <path d="M 55 120 Q 65 120 65 110 Q 65 120 75 120 Q 65 120 65 130 Q 65 120 55 120 Z" />
    <path d="M 345 90 Q 352 90 352 83 Q 352 90 359 90 Q 352 90 352 97 Q 352 90 345 90 Z" />
  </g>
</svg>
