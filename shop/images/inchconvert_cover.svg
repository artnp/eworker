<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint / Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Paper Mockup (A4 Sheet layout) -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="48" width="240" height="270" rx="14" fill="url(#paperGrad)" />
    <!-- Paper fold corner -->
    <path d="M296 48 L320 72 H302 A6 6 0 0 1 296 66 Z" fill="#cbd5e1" opacity="0.6" />
  </g>

  <!-- Paper Header Tag -->
  <rect x="100" y="64" width="70" height="12" rx="4" fill="#e2e8f0" />
  <rect x="180" y="67" width="40" height="6" rx="3" fill="#cbd5e1" />
  <rect x="226" y="67" width="30" height="6" rx="3" fill="#cbd5e1" />

  <!-- Cut Marks (Corner marks on paper) -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round">
    <!-- Top-left crop -->
    <line x1="94" y1="88" x2="94" y2="94" />
    <line x1="88" y1="94" x2="94" y2="94" />
    <!-- Top-right crop -->
    <line x1="306" y1="88" x2="306" y2="94" />
    <line x1="306" y1="94" x2="312" y2="94" />
    <!-- Bottom-left crop -->
    <line x1="94" y1="298" x2="94" y2="304" />
    <line x1="88" y1="298" x2="94" y2="298" />
    <!-- Bottom-right crop -->
    <line x1="306" y1="298" x2="306" y2="304" />
    <line x1="306" y1="298" x2="312" y2="298" />
  </g>

  <!-- Photo Grid: 3 Columns x 2 Rows -->
  <!-- Col 1, Row 1 -->
  <g transform="translate(100, 92)">
    <rect width="58" height="74" rx="6" fill="#f1f5f9" stroke="#93c5fd" stroke-width="1.5" />
    <rect x="4" y="4" width="50" height="66" rx="4" fill="url(#photoGrad)" opacity="0.25" />
    <!-- Portrait Head -->
    <circle cx="29" cy="28" r="12" fill="#3b82f6" />
    <!-- Portrait Shoulders -->
    <path d="M13 58 C13 46 20 42 29 42 C38 42 45 46 45 58 Z" fill="#3b82f6" />
    <!-- Mini size badge -->
    <rect x="6" y="56" width="22" height="10" rx="3" fill="#1e293b" opacity="0.8" />
    <text x="17" y="64" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="7" font-weight="700" text-anchor="middle">1"</text>
  </g>

  <!-- Col 2, Row 1 -->
  <g transform="translate(171, 92)">
    <rect width="58" height="74" rx="6" fill="#f1f5f9" stroke="#93c5fd" stroke-width="1.5" />
    <rect x="4" y="4" width="50" height="66" rx="4" fill="url(#photoGrad)" opacity="0.25" />
    <circle cx="29" cy="28" r="12" fill="#3b82f6" />
    <path d="M13 58 C13 46 20 42 29 42 C38 42 45 46 45 58 Z" fill="#3b82f6" />
    <rect x="6" y="56" width="22" height="10" rx="3" fill="#1e293b" opacity="0.8" />
    <text x="17" y="64" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="7" font-weight="700" text-anchor="middle">1.5"</text>
  </g>

  <!-- Col 3, Row 1 -->
  <g transform="translate(242, 92)">
    <rect width="58" height="74" rx="6" fill="#f1f5f9" stroke="#93c5fd" stroke-width="1.5" />
    <rect x="4" y="4" width="50" height="66" rx="4" fill="url(#photoGrad)" opacity="0.25" />
    <circle cx="29" cy="28" r="12" fill="#3b82f6" />
    <path d="M13 58 C13 46 20 42 29 42 C38 42 45 46 45 58 Z" fill="#3b82f6" />
    <rect x="6" y="56" width="22" height="10" rx="3" fill="#1e293b" opacity="0.8" />
    <text x="17" y="64" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="7" font-weight="700" text-anchor="middle">2"</text>
  </g>

  <!-- Col 1, Row 2 -->
  <g transform="translate(100, 178)">
    <rect width="58" height="74" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 2" />
    <rect x="4" y="4" width="50" height="66" rx="4" fill="#e2e8f0" opacity="0.5" />
    <circle cx="29" cy="28" r="12" fill="#64748b" opacity="0.6" />
    <path d="M13 58 C13 46 20 42 29 42 C38 42 45 46 45 58 Z" fill="#64748b" opacity="0.6" />
  </g>

  <!-- Col 2, Row 2 -->
  <g transform="translate(171, 178)">
    <rect width="58" height="74" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 2" />
    <rect x="4" y="4" width="50" height="66" rx="4" fill="#e2e8f0" opacity="0.5" />
    <circle cx="29" cy="28" r="12" fill="#64748b" opacity="0.6" />
    <path d="M13 58 C13 46 20 42 29 42 C38 42 45 46 45 58 Z" fill="#64748b" opacity="0.6" />
  </g>

  <!-- Col 3, Row 2 -->
  <g transform="translate(242, 178)">
    <rect width="58" height="74" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 2" />
    <rect x="4" y="4" width="50" height="66" rx="4" fill="#e2e8f0" opacity="0.5" />
    <circle cx="29" cy="28" r="12" fill="#64748b" opacity="0.6" />
    <path d="M13 58 C13 46 20 42 29 42 C38 42 45 46 45 58 Z" fill="#64748b" opacity="0.6" />
  </g>

  <!-- Measurement guide / Cutting dashed lines -->
  <line x1="92" y1="172" x2="308" y2="172" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
  <line x1="164" y1="88" x2="164" y2="258" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
  <line x1="235" y1="88" x2="235" y2="258" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />

  <!-- Floating PDF / Print Badge (Top Right) -->
  <g transform="translate(296, 42)" filter="url(#cardShadow)">
    <circle cx="22" cy="22" r="22" fill="#ef4444" />
    <!-- PDF Text -->
    <text x="22" y="27" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" text-anchor="middle">PDF</text>
  </g>

  <!-- Floating Scissors / Cut Icon (Left Center) -->
  <g transform="translate(56, 156)" filter="url(#cardShadow)">
    <circle cx="20" cy="20" r="20" fill="#f59e0b" />
    <path d="M14 16 L26 24 M14 24 L26 16 M13 15 A2.5 2.5 0 1 1 11 12 A2.5 2.5 0 0 1 13 15 M13 25 A2.5 2.5 0 1 1 11 28 A2.5 2.5 0 0 1 13 25" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Floating Size Pill (Bottom Left Paper) -->
  <g transform="translate(100, 268)">
    <rect width="90" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="45" y="282" fill="#1d4ed8" font-family="'Prompt', sans-serif" font-size="10" font-weight="700" text-anchor="middle">📏 A4 / 4×6 นิ้ว</text>
  </g>

  <!-- Floating Price Tag (Bottom Right Paper) -->
  <g transform="translate(220, 264)" filter="url(#cardShadow)">
    <rect width="80" height="26" rx="13" fill="#16a34a" />
    <text x="40" y="281" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="12" font-weight="800" text-anchor="middle">⚡ 5 บาท</text>
  </g>

  <!-- Bottom Badge Banner -->
  <rect x="50" y="336" width="300" height="42" rx="12" fill="url(#badgeGrad)" />
  <text x="200" y="363" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    จัดรูปติดบัตร • ลงกระดาษพิมพ์ PDF
  </text>
</svg>
