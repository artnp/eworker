<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Slip Card Container -->
  <g filter="url(#cardShadow)">
    <rect x="85" y="45" width="230" height="310" rx="20" fill="#ffffff" />
    
    <!-- Top Header Banner of Slip -->
    <path d="M 85 65 Q 85 45 105 45 L 295 45 Q 315 45 315 65 L 315 110 Q 200 135 85 110 Z" fill="url(#headerGrad)" />
  </g>

  <!-- Header text simulation & icon -->
  <text x="200" y="80" fill="#ffffff" font-family="'Prompt', sans-serif" font-weight="800" font-size="16" text-anchor="middle" letter-spacing="1">PROMPTPAY</text>
  <text x="200" y="98" fill="#d1fae5" font-family="'Prompt', sans-serif" font-weight="600" font-size="11" text-anchor="middle">สลิปชำระเงิน QR CODE</text>

  <!-- QR Code Container Box -->
  <rect x="130" y="125" width="140" height="140" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- QR Eye: Top-Left -->
  <rect x="145" y="140" width="34" height="34" rx="6" fill="#0f172a" />
  <rect x="151" y="146" width="22" height="22" rx="3" fill="#ffffff" />
  <rect x="156" y="151" width="12" height="12" rx="2" fill="#10b981" />

  <!-- QR Eye: Top-Right -->
  <rect x="221" y="140" width="34" height="34" rx="6" fill="#0f172a" />
  <rect x="227" y="146" width="22" height="22" rx="3" fill="#ffffff" />
  <rect x="232" y="151" width="12" height="12" rx="2" fill="#10b981" />

  <!-- QR Eye: Bottom-Left -->
  <rect x="145" y="216" width="34" height="34" rx="6" fill="#0f172a" />
  <rect x="151" y="222" width="22" height="22" rx="3" fill="#ffffff" />
  <rect x="156" y="227" width="12" height="12" rx="2" fill="#10b981" />

  <!-- QR Pixels Inside -->
  <rect x="190" y="142" width="8" height="8" rx="1.5" fill="#0f172a" />
  <rect x="202" y="142" width="8" height="8" rx="1.5" fill="#0f172a" />
  <rect x="186" y="154" width="8" height="8" rx="1.5" fill="#0f172a" />
  <rect x="198" y="154" width="12" height="8" rx="1.5" fill="#10b981" />
  <rect x="186" y="168" width="10" height="10" rx="2" fill="#0f172a" />
  <rect x="204" y="168" width="8" height="8" rx="1.5" fill="#0f172a" />
  <rect x="145" y="186" width="12" height="8" rx="1.5" fill="#0f172a" />
  <rect x="162" y="186" width="8" height="8" rx="1.5" fill="#0f172a" />
  <rect x="176" y="186" width="16" height="8" rx="1.5" fill="#10b981" />
  <rect x="198" y="186" width="14" height="8" rx="1.5" fill="#0f172a" />
  <rect x="218" y="186" width="10" height="8" rx="1.5" fill="#0f172a" />
  <rect x="236" y="186" width="18" height="8" rx="1.5" fill="#0f172a" />

  <rect x="188" y="202" width="10" height="8" rx="1.5" fill="#0f172a" />
  <rect x="206" y="202" width="14" height="8" rx="1.5" fill="#10b981" />
  <rect x="228" y="202" width="8" height="8" rx="1.5" fill="#0f172a" />
  <rect x="190" y="218" width="14" height="8" rx="1.5" fill="#0f172a" />
  <rect x="212" y="218" width="8" height="8" rx="1.5" fill="#0f172a" />
  <rect x="228" y="218" width="14" height="8" rx="1.5" fill="#0f172a" />
  <rect x="188" y="234" width="8" height="14" rx="1.5" fill="#0f172a" />
  <rect x="204" y="234" width="16" height="12" rx="1.5" fill="#0f172a" />
  <rect x="228" y="238" width="14" height="10" rx="1.5" fill="#10b981" />

  <!-- Center PromptPay Logo Symbol -->
  <circle cx="200" cy="195" r="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <path d="M195 195 L200 189 L205 195 L200 201 Z" fill="#059669" />

  <!-- Amount and Account lines -->
  <text x="200" y="295" fill="#0f172a" font-family="'Prompt', sans-serif" font-weight="800" font-size="20" text-anchor="middle">฿ 00.00</text>
  <rect x="135" y="308" width="130" height="5" rx="2.5" fill="#e2e8f0" />
  <rect x="155" y="320" width="90" height="5" rx="2.5" fill="#cbd5e1" />

  <!-- Badge 🎁 ฟรี (Free) Glow -->
  <g filter="url(#glowGreen)">
    <rect x="245" y="25" width="110" height="34" rx="17" fill="#10b981" />
    <text x="300" y="47" fill="#ffffff" font-family="'Prompt', sans-serif" font-weight="700" font-size="13" text-anchor="middle">🎁 ฟรี (Free)</text>
  </g>
</svg>
