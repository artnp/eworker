<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <!-- Cassette Shell Gradient -->
    <linearGradient id="cassetteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="40%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Neon Magenta/Purple Gradient -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Cassette Label Gradient -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cassetteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Background Glows -->
  <circle cx="100" cy="90" r="130" fill="#ec4899" opacity="0.18" filter="url(#glowPink)" />
  <circle cx="310" cy="310" r="140" fill="#06b6d4" opacity="0.18" filter="url(#glowCyan)" />

  <!-- Equalizer Visualizer Bars at Top -->
  <g opacity="0.45">
    <rect x="50" y="55" width="6" height="24" rx="3" fill="url(#neonPink)" />
    <rect x="64" y="42" width="6" height="37" rx="3" fill="url(#neonPink)" />
    <rect x="78" y="30" width="6" height="49" rx="3" fill="url(#neonPink)" />
    <rect x="92" y="48" width="6" height="31" rx="3" fill="url(#neonPink)" />
    <rect x="106" y="60" width="6" height="19" rx="3" fill="url(#neonPink)" />

    <rect x="288" y="58" width="6" height="21" rx="3" fill="url(#neonCyan)" />
    <rect x="302" y="44" width="6" height="35" rx="3" fill="url(#neonCyan)" />
    <rect x="316" y="32" width="6" height="47" rx="3" fill="url(#neonCyan)" />
    <rect x="330" y="46" width="6" height="33" rx="3" fill="url(#neonCyan)" />
    <rect x="344" y="62" width="6" height="17" rx="3" fill="url(#neonCyan)" />
  </g>

  <!-- CASSETTE TAPE SHELL -->
  <g filter="url(#cassetteShadow)">
    <!-- Outer Shell -->
    <rect x="45" y="90" width="310" height="200" rx="18" fill="url(#cassetteBody)" stroke="#475569" stroke-width="2.5" />

    <!-- Corner Screw Holes -->
    <circle cx="62" cy="106" r="4.5" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <circle cx="338" cy="106" r="4.5" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <circle cx="62" cy="274" r="4.5" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <circle cx="338" cy="274" r="4.5" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />

    <!-- Main Cassette Label Sticker -->
    <rect x="65" y="108" width="270" height="135" rx="10" fill="url(#labelGrad)" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Decorative Top Color Bands on Label -->
    <rect x="65" y="108" width="270" height="14" rx="3" fill="url(#neonPink)" />
    <rect x="65" y="122" width="270" height="6" fill="url(#neonCyan)" />

    <!-- Label Typography -->
    <text x="80" y="148" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#0f172a" letter-spacing="1.5">MIXTAPE</text>
    <text x="80" y="165" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#ec4899" letter-spacing="0.5">#Volume1</text>

    <!-- Side A / 9 Tracks Indicator -->
    <rect x="282" y="137" width="40" height="18" rx="4" fill="#0f172a" />
    <text x="302" y="150" font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="#f8fafc" text-anchor="middle">SIDE A</text>
    <text x="322" y="168" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#64748b" text-anchor="end">9 TRACKS</text>

    <!-- Center Cutout Area (Clear Tape Window) -->
    <rect x="90" y="174" width="220" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Tape Spools -->
    <!-- Left Spool -->
    <circle cx="145" cy="203" r="22" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="145" cy="203" r="14" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <circle cx="145" cy="203" r="6" fill="#f8fafc" />
    <!-- Left Spool Teeth -->
    <line x1="145" y1="184" x2="145" y2="189" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="145" y1="217" x2="145" y2="222" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="203" x2="131" y2="203" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="159" y1="203" x2="164" y2="203" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Tape View Window -->
    <rect x="175" y="193" width="50" height="20" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <!-- Magnetic Tape Ribbon -->
    <line x1="167" y1="203" x2="175" y2="203" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
    <line x1="175" y1="203" x2="225" y2="203" stroke="#92400e" stroke-width="8" />
    <line x1="225" y1="203" x2="233" y2="203" stroke="#78350f" stroke-width="6" stroke-linecap="round" />

    <!-- Right Spool -->
    <circle cx="255" cy="203" r="22" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="255" cy="203" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <circle cx="255" cy="203" r="6" fill="#f8fafc" />
    <!-- Right Spool Teeth -->
    <line x1="255" y1="184" x2="255" y2="189" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="255" y1="217" x2="255" y2="222" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="236" y1="203" x2="241" y2="203" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="269" y1="203" x2="274" y2="203" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Trapezoid Base at Bottom of Cassette -->
    <path d="M100 290 L120 258 L280 258 L300 290 Z" fill="#1f2937" stroke="#374151" stroke-width="2" />
    <circle cx="140" cy="274" r="5" fill="#0f172a" stroke="#4b5563" stroke-width="1.5" />
    <circle cx="200" cy="274" r="5" fill="#0f172a" stroke="#4b5563" stroke-width="1.5" />
    <circle cx="260" cy="274" r="5" fill="#0f172a" stroke="#4b5563" stroke-width="1.5" />
  </g>

  <!-- Glowing Soundwaves & Headphone Badge Bottom Floating -->
  <g transform="translate(200, 345)">
    <!-- Audio Wave lines -->
    <path d="M-130 0 Q-100 -12 -70 0 T-10 0 T50 0 T110 0 T140 0" fill="none" stroke="url(#neonPink)" stroke-width="2.5" opacity="0.6" />
    <path d="M-140 0 Q-90 12 -40 0 T20 0 T80 0 T130 0" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" opacity="0.6" />

    <!-- Floating Badge -->
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#111827" stroke="url(#neonPink)" stroke-width="1.8" filter="url(#cassetteShadow)" />
    <!-- Music note / headphones icon + text -->
    <text x="0" y="5" font-family="'Prompt', 'Inter', sans-serif" font-weight="700" font-size="13" fill="#f8fafc" text-anchor="middle">
      🎵 ฟังฟรี 1 - 5 • ปลดล็อกครบ 9 คลิป
    </text>
  </g>
</svg>
