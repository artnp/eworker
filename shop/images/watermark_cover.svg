<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Document Gradients -->
    <linearGradient id="paperGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="paperGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Watermark Stamp Red/Crimson Gradient -->
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Badge Blue/Cyan Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Photo Mockup Sky Gradient -->
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="stampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.35" />
    </filter>
    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />

  <!-- Technical Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.2">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="#3b82f6" opacity="0.12" filter="blur(40px)" />

  <!-- Multi-layer stacked papers behind -->
  <g filter="url(#cardShadow)">
    <!-- Back Page 3 -->
    <rect x="100" y="32" width="210" height="270" rx="12" fill="url(#paperGrad2)" transform="rotate(7 205 167)" opacity="0.6" />
    <!-- Back Page 2 -->
    <rect x="94" y="38" width="210" height="270" rx="12" fill="url(#paperGrad2)" transform="rotate(-5 199 173)" opacity="0.8" />
    <!-- Main Front Page 1 -->
    <rect x="85" y="44" width="230" height="275" rx="14" fill="url(#paperGrad1)" />
    <!-- Fold Corner -->
    <path d="M291 44 L315 68 H297 A6 6 0 0 1 291 62 Z" fill="#cbd5e1" opacity="0.7" />
  </g>

  <!-- Document Header Content -->
  <g>
    <!-- PDF / Multi-Image Badge -->
    <rect x="104" y="62" width="46" height="18" rx="5" fill="#ef4444" />
    <text x="127" y="75" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">PDF</text>

    <rect x="156" y="62" width="44" height="18" rx="5" fill="#3b82f6" />
    <text x="178" y="75" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">IMG</text>

    <!-- Document Skeleton Lines -->
    <rect x="104" y="92" width="192" height="6" rx="3" fill="#e2e8f0" />
    <rect x="104" y="106" width="160" height="6" rx="3" fill="#e2e8f0" />
    <rect x="104" y="120" width="180" height="6" rx="3" fill="#e2e8f0" />

    <!-- Photo Container Mockup -->
    <rect x="104" y="136" width="192" height="96" rx="8" fill="url(#photoGrad)" />
    <!-- Landscape / Sun in Photo -->
    <circle cx="260" cy="160" r="14" fill="#fde047" opacity="0.85" />
    <path d="M104 212 L145 175 L185 205 L230 165 L296 215 L296 232 L104 232 Z" fill="#38bdf8" opacity="0.7" />

    <!-- Lower Text Lines -->
    <rect x="104" y="244" width="192" height="6" rx="3" fill="#e2e8f0" />
    <rect x="104" y="258" width="140" height="6" rx="3" fill="#e2e8f0" />
    <rect x="104" y="272" width="170" height="6" rx="3" fill="#e2e8f0" />
    <rect x="104" y="286" width="90" height="6" rx="3" fill="#e2e8f0" />
  </g>

  <!-- Large Watermark Rubber Stamp (Rotated across document with transparency) -->
  <g transform="rotate(-22 200 185)" filter="url(#stampShadow)">
    <!-- Outer Double Border Stamp Box -->
    <rect x="65" y="152" width="270" height="68" rx="10" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="8 4" opacity="0.88" />
    <rect x="71" y="158" width="258" height="56" rx="7" fill="#fee2e2" fill-opacity="0.45" stroke="#ef4444" stroke-width="2" opacity="0.88" />

    <!-- Center Icon & Text -->
    <g fill="#dc2626" opacity="0.92">
      <!-- Star Icons on sides -->
      <polygon points="98,182 101,190 109,190 103,195 105,203 98,198 91,203 93,195 87,190 95,190" fill="#dc2626" />
      <polygon points="302,182 305,190 313,190 307,195 309,203 302,198 295,203 297,195 291,190 299,190" fill="#dc2626" />

      <text x="200" y="196" font-family="'Outfit', 'Prompt', sans-serif" font-size="25" font-weight="900" letter-spacing="4" text-anchor="middle">WATERMARK</text>
    </g>

    <!-- Subtitle text inside stamp -->
    <text x="200" y="209" fill="#b91c1c" font-family="'Prompt', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle" opacity="0.85">ปั๊มซ้ำตำแหน่งเดิมทุกหน้า</text>
  </g>

  <!-- Floating Feature Tags -->
  <!-- Top Left Pill: PNG Transparency -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="24" width="135" height="30" rx="15" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="39" cy="39" r="6" fill="#3b82f6" />
    <text x="52" y="43" fill="#f8fafc" font-family="'Prompt', sans-serif" font-size="10" font-weight="700">PNG โปร่งใส 100%</text>
  </g>

  <!-- Top Right Pill: Multi-pages -->
  <g filter="url(#cardShadow)">
    <rect x="250" y="24" width="126" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <circle cx="265" cy="39" r="6" fill="#10b981" />
    <text x="278" y="43" fill="#f8fafc" font-family="'Prompt', sans-serif" font-size="10" font-weight="700">ไม่จำกัดจำนวนหน้า</text>
  </g>

  <!-- Bottom Floating Price & Action Pill -->
  <g filter="url(#pillGlow)">
    <rect x="75" y="340" width="250" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="100" cy="361" r="13" fill="#0284c7" />
    <!-- Checkmark icon -->
    <path d="M95 361 L99 365 L106 357" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="122" y="367" fill="#f8fafc" font-family="'Prompt', sans-serif" font-size="13.5" font-weight="800">ปั๊มลายน้ำ • ฿5 / งาน</text>
  </g>
</svg>

