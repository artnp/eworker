<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="spCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="spResultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="spPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="spChatGptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="spCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="spAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="spDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="spGlowPrimary" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.5" />
    </filter>
    <filter id="spGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10a37f" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#spBgGrad)" />

  <!-- Technical Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.2">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="90" cy="120" r="80" fill="#6366f1" opacity="0.15" filter="blur(30px)" />
  <circle cx="310" cy="220" r="90" fill="#10a37f" opacity="0.16" filter="blur(30px)" />

  <!-- Main Spintax Editor Card (Left/Center tilt) -->
  <g filter="url(#spDropShadow)" transform="translate(42, 60)">
    <rect width="210" height="155" rx="14" fill="url(#spCardGrad)" stroke="#c7d2fe" stroke-width="1.5" />
    
    <!-- Header of editor card -->
    <rect x="0" y="0" width="210" height="32" rx="14" fill="#f8fafc" />
    <rect x="0" y="24" width="210" height="8" fill="#f8fafc" />
    <line x1="0" y1="32" x2="210" y2="32" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Dots -->
    <circle cx="16" cy="16" r="3.5" fill="#ef4444" />
    <circle cx="27" cy="16" r="3.5" fill="#f59e0b" />
    <circle cx="38" cy="16" r="3.5" fill="#10b981" />
    <text x="56" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748b">SPINTAX EDITOR</text>

    <!-- Code Content -->
    <g transform="translate(14, 46)">
      <!-- Line 1: Nested Spintax -->
      <text font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#4f46e5">{</text>
      <text x="8" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#0284c7">{</text>
      <text x="16" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">สวัสดี</text>
      <text x="44" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#94a3b8">|</text>
      <text x="52" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">Hello</text>
      <text x="82" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#0284c7">}</text>
      <text x="90" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#94a3b8">|</text>
      <text x="98" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">ยินดีต้อนรับ</text>
      <text x="156" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#4f46e5">}</text>

      <!-- Line 2 -->
      <g transform="translate(0, 24)">
        <text font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#4f46e5">{</text>
        <text x="8" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">บริการ</text>
        <text x="42" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#94a3b8">|</text>
        <text x="50" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#059669">คุณภาพ</text>
        <text x="90" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#94a3b8">|</text>
        <text x="98" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#0284c7">พรีเมียม</text>
        <text x="142" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#4f46e5">}</text>
      </g>

      <!-- Line 3 -->
      <g transform="translate(0, 48)">
        <text font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#4f46e5">{</text>
        <text x="8" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#d97706">สั่งเลย</text>
        <text x="42" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#94a3b8">|</text>
        <text x="50" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">Order Now</text>
        <text x="110" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#4f46e5">}</text>
      </g>
    </g>

    <!-- Bottom Mini Status -->
    <rect x="12" y="124" width="186" height="20" rx="6" fill="#f1f5f9" />
    <circle cx="24" cy="134" r="3.5" fill="#10b981" />
    <text x="34" y="137.5" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="9" font-weight="700" fill="#166534">สุ่มได้ 1,458 รูปแบบ (Nested 100%)</text>
  </g>

  <!-- Transform Arrows -->
  <g transform="translate(230, 155)">
    <circle cx="16" cy="16" r="18" fill="url(#spPrimaryGrad)" filter="url(#spGlowPrimary)" />
    <path d="M12 11 L18 16 L12 21 M16 16 L22 16" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Output Result Cards (Overlapping Right) -->
  <g filter="url(#spDropShadow)" transform="translate(195, 185)">
    <!-- Result Card 2 (back) -->
    <rect x="10" y="-12" width="165" height="74" rx="12" fill="#ffffff" opacity="0.65" transform="rotate(3)" />
    
    <!-- Result Card 1 (front) -->
    <rect width="168" height="78" rx="12" fill="url(#spResultGrad)" stroke="#86efac" stroke-width="1.5" />
    <rect x="0" y="0" width="168" height="6" rx="3" fill="#10b981" />

    <g transform="translate(12, 22)">
      <text font-family="'Segoe UI', 'Prompt', sans-serif" font-size="11" font-weight="800" fill="#047857">✨ ผลลัพธ์สุ่มสด:</text>
      <text y="18" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="10" font-weight="600" fill="#0f172a">"สวัสดี บริการคุณภาพ สั่งเลย"</text>
      <text y="34" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="9" font-weight="500" fill="#64748b">เป็นธรรมชาติ ไม่ซ้ำคำ 100%</text>
    </g>
  </g>

  <!-- AI / ChatGPT Badge Top Right -->
  <g filter="url(#spGlowGreen)" transform="translate(260, 48)">
    <rect width="105" height="30" rx="15" fill="url(#spChatGptGrad)" />
    <!-- Robot / Sparkle Icon -->
    <circle cx="16" cy="15" r="7" fill="#ffffff" opacity="0.25" />
    <path d="M13 15 L19 15 M16 12 L16 18" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <text x="30" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">CHATGPT AI</text>
  </g>

  <!-- Thai / English Chip Top Left -->
  <g transform="translate(35, 34)">
    <rect width="84" height="22" rx="11" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
    <text x="42" y="15" text-anchor="middle" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="9" font-weight="700" fill="#e0e7ff">🇹🇭 ไทย - อังกฤษ 🇬🇧</text>
  </g>

  <!-- Bottom Main Title Banner -->
  <g transform="translate(30, 305)">
    <!-- Main Title -->
    <text x="170" y="24" text-anchor="middle" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      Spintax &amp; Nested Studio
    </text>
    
    <!-- Subtitle -->
    <text x="170" y="46" text-anchor="middle" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="12" font-weight="500" fill="#93c5fd">
      ปั่นประโยคซ้ำซ้อน สุ่มได้ไม่จำกัด เชื่อมต่อ ChatGPT ทันที
    </text>

    <!-- Badges Row -->
    <g transform="translate(25, 58)">
      <!-- Badge 1 -->
      <rect width="82" height="18" rx="9" fill="rgba(99, 102, 241, 0.35)" stroke="#818cf8" stroke-width="1" />
      <text x="41" y="12.5" text-anchor="middle" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="8.5" font-weight="700" fill="#c7d2fe">⚡ สุ่มสด 1 คลิก</text>

      <!-- Badge 2 -->
      <rect x="90" width="94" height="18" rx="9" fill="rgba(16, 185, 129, 0.35)" stroke="#34d399" stroke-width="1" />
      <text x="137" y="12.5" text-anchor="middle" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="8.5" font-weight="700" fill="#a7f3d0">🤖 Prompt ChatGPT</text>

      <!-- Badge 3 -->
      <rect x="192" width="98" height="18" rx="9" fill="rgba(14, 165, 233, 0.35)" stroke="#38bdf8" stroke-width="1" />
      <text x="241" y="12.5" text-anchor="middle" font-family="'Segoe UI', 'Prompt', sans-serif" font-size="8.5" font-weight="700" fill="#bae6fd">📚 คลังคำเหมือน TH/EN</text>
    </g>
  </g>
</svg>