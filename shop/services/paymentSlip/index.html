<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon & Web App Icon -->
    <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/images/favicon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="../../assets/images/favicon.png">
    <link rel="shortcut icon" href="../../favicon.ico">
    <title>Smart QR Payment - สร้างสลิปแจ้งยอด</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+Thai:wght@300;400;600&display=swap"
        rel="stylesheet">
    <!-- QR Code & Screenshot Libs (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #8DEB2D;
            --bg: #181b20;
            --surface: #1e2228;
            --border: #2D3748;
            --text: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Outfit', 'Noto Sans Thai', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* ===== PAGE SHELL ===== */
        .page-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px 16px 10px;
            gap: 8px;
        }

        /* Title bar */
        .page-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            flex-shrink: 0;
        }

        /* Typing hint */
        .type-hint {
            text-align: center;
            font-size: 0.72rem;
            color: #555e6e;
            flex-shrink: 0;
            letter-spacing: 0.2px;
        }

        .type-hint strong {
            color: #7c8b9e;
            font-weight: 600;
        }

        /* ===== TWO-COLUMN BODY ===== */
        .main-body {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
            align-items: stretch;
        }

        /* ==== LEFT: Input Panel ==== */
        .input-panel {
            background: var(--surface);
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .fields-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header-section {
            padding-bottom: 8px;
            border-bottom: 1px solid #2a303b;
            margin-bottom: 2px;
        }

        .header-section h3 {
            margin: 0;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .header-section p {
            margin: 2px 0 0;
            color: #5c6a7a;
            font-size: 0.7rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        label {
            font-size: 0.72rem;
            color: #8896a8;
            font-weight: 500;
        }

        /* ==== WHITE INPUTS ==== */
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 7px 10px;
            background: #ffffff;
            border: 1.5px solid #dde3ec;
            border-radius: 8px;
            color: #1a1d24;
            font-size: 0.85rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder {
            color: #a0aab8;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(141, 235, 45, 0.15);
        }

        /* Amount input — bigger & highlighted */
        #inp-amount {
            font-size: 1.5rem;
            font-weight: 800;
            color: #111;
            padding: 8px 10px;
            background: #fff;
            border: 2px solid var(--primary);
            box-shadow: 0 0 0 3px rgba(141, 235, 45, 0.12);
            letter-spacing: -0.5px;
        }

        .amount-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .amount-label-row label {
            color: var(--primary);
            font-weight: 700;
            font-size: 0.75rem;
        }

        .divider {
            border: 0;
            border-top: 1px solid #2a303b;
            margin: 6px 0;
        }

        /* Theme dots */
        .theme-options {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .color-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s;
            flex-shrink: 0;
        }

        .color-dot.active {
            border-color: #fff;
            transform: scale(1.2);
        }

        /* Update button */
        .btn-action {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 9px 0;
            border-radius: 50px;
            width: 100%;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn-action:hover {
            opacity: 0.88;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        /* ==== RIGHT: Preview Area ==== */
        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 0;
            padding: 6px 0;
        }

        /* Slip card */
        #pay-card {
            width: 240px;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 36px rgba(0, 0, 0, 0.6);
        }

        .card-top {
            background: var(--primary);
            padding: 14px 14px 26px;
            text-align: center;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            color: #000;
        }

        .card-top h2 {
            margin: 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            font-weight: 800;
        }

        .card-top p {
            margin: 2px 0 0;
            opacity: 0.7;
            font-size: 0.72rem;
        }

        .card-content {
            position: relative;
            z-index: 1;
            margin-top: -18px;
            padding: 0 12px 14px;
            text-align: center;
        }

        .qr-box {
            position: relative;
            z-index: 2;
            background: #fff;
            padding: 8px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        }

        .qr-box img,
        .qr-box canvas {
            display: block;
            width: 120px !important;
            height: 120px !important;
        }

        .amount-text {
            font-size: 1.75rem;
            font-weight: 800;
            color: #1a1d24;
            margin: 8px 0 2px;
            letter-spacing: -0.5px;
        }

        .amount-upload-label {
            font-size: 0.68rem;
            color: #636e72;
        }

        .acc-details {
            margin-top: 8px;
            color: #2d3436;
            font-size: 0.76rem;
        }

        .acc-number {
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.8px;
            color: #000;
            margin: 2px 0;
        }

        .scan-hint {
            margin-top: 8px;
            font-size: 0.6rem;
            color: #b2bec3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bank-logos {
            margin-top: 4px;
            display: flex;
            justify-content: center;
            gap: 3px;
            flex-wrap: wrap;
        }

        .bank-icon {
            width: 17px;
            height: 17px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ddd;
            background: #fff;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 8px;
            width: 240px;
        }

        .btn-sm {
            flex: 1;
            padding: 8px 6px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: #fff;
            cursor: pointer;
            font-size: 0.78rem;
            font-family: inherit;
            transition: background 0.15s;
        }

        .btn-sm:hover {
            background: #252a33;
        }

        .btn-primary {
            background: #ffffff;
            color: #000;
            font-weight: 700;
            border: none;
        }

        .btn-primary:hover {
            background: #ededf0;
        }

        /* Status text */
        #msg-status {
            margin: 0;
            color: #5c6a7a;
            font-size: 0.72rem;
        }

        /* ==== TOAST ==== */
        .toast-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.88);
            background: rgba(15, 17, 21, 0.96);
            color: #fff;
            padding: 22px 40px;
            border-radius: 18px;
            font-size: 1.2rem;
            font-weight: 700;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: all 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .toast-overlay.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .toast-icon {
            font-size: 2.6rem;
        }
    </style>
</head>

<body>

                        <div class="color-dot" style="background:#55efc4" onclick="setTheme('#55efc4', this)"></div>

                                <img src="https://raw.githubusercontent.com/casperstack/thai-banks-logo/master/icons/KBANK.png"
                                    class="bank-icon" crossorigin="anonymous">

                                <img src="https://raw.githubusercontent.com/casperstack/thai-banks-logo/master/icons/BBL.png"

                                <img src="https://raw.githubusercontent.com/casperstack/thai-banks-logo/master/icons/BAY.png"

    <!-- Toast Overlay -->
    <div id="toast-overlay" class="toast-overlay">
        <div class="toast-icon">✅</div>
        <div id="toast-text">คัดลอกสำเร็จ!</div>
    </div>

    <script>
        // --- PromptPay CRC Logic ---
        // --- PromptPay CRC Logic (CCITT-FALSE) ---
        function crc16(data) {
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
                crc ^= data.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) > 0) crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                    else crc = (crc << 1) & 0xFFFF;
                }
            }
            return crc.toString(16).toUpperCase().padStart(4, '0');
        }

        function generatePayload(id, amount) {
            // Fallback for testing with non-digit inputs
            let target = id.replace(/[^0-9]/g, '');
            if (target.length === 0) target = '0000000000'; // Dummy ID

            if (!target) return "";

            // Check if it is a Mobile Phone (10 digits starting with 0) -> Format to 0066...
            // Citizen ID (13 digits) or E-Wallet (15 digits) should be kept as is.
            if (target.length === 10 && target.startsWith('0')) {
                target = '0066' + target.substring(1);
            }

            // Construct Tag 29 (Merchant Account Information)
            // ID Application: A000000677010111 (PromptPay)
            let merchantInfo =
                '0016A000000677010111' +
                '01' + ('00' + target.length).slice(-2) + target;
            let merchantInfoLen = ('00' + merchantInfo.length).slice(-2);

            let payload =
                '000201' +
                '010212' + // 12=Dynamic (One-time use)
                '29' + merchantInfoLen + merchantInfo +
                '5802TH' +
                '5303764';

            // Tag 54: Amount (Optional - Include only if > 0)
            let amtVal = parseFloat(amount);
            if (!isNaN(amtVal) && amtVal > 0) {
                let amtStr = amtVal.toFixed(2);
                payload += '54' + ('00' + amtStr.length).slice(-2) + amtStr;
            }

            payload += '6304'; // CRC Tag

            return payload + crc16(payload);
        }

        // --- Main Logic ---
        const els = {
            shop: document.getElementById('inp-shop'),
            pp: document.getElementById('inp-pp'),
            acc: document.getElementById('inp-acc'),
            amt: document.getElementById('inp-amount')
        };

        // Load / Save LocalStorage
        function loadData() {
            if (localStorage.getItem('smart_shop')) els.shop.value = localStorage.getItem('smart_shop');
            if (localStorage.getItem('smart_pp')) els.pp.value = localStorage.getItem('smart_pp');
            if (localStorage.getItem('smart_acc')) els.acc.value = localStorage.getItem('smart_acc');

            // Load Theme
            const savedTheme = localStorage.getItem('smart_theme');
            if (savedTheme) {
                // Find the matching element to set 'active' class
                const themeEl = Array.from(document.querySelectorAll('.color-dot')).find(el =>
                    el.getAttribute('onclick').includes(savedTheme)
                );
                setTheme(savedTheme, themeEl);
            }
        }

        function saveData() {
            localStorage.setItem('smart_shop', els.shop.value);
            localStorage.setItem('smart_pp', els.pp.value);
            localStorage.setItem('smart_acc', els.acc.value);
        }

        function setTheme(color, el) {
            document.documentElement.style.setProperty('--primary', color);
            document.getElementById('card-bg').style.backgroundColor = color;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            if (el) el.classList.add('active');

            // Save Theme
            localStorage.setItem('smart_theme', color);
        }

        function updatePreview() {
            saveData();

            // Text Updates
            document.getElementById('txt-shop').innerText = els.shop.value || "MY SHOP";
            document.getElementById('txt-acc').innerText = els.acc.value || "Account Name";

            // Amount
            let val = parseFloat(els.amt.value) || 0;
            document.getElementById('txt-amount').innerText = val.toLocaleString('en-US', { minimumFractionDigits: 2 });

            // Format PP
            let rawPP = els.pp.value;
            let fmtPP = rawPP;
            if (rawPP.length === 10) fmtPP = `${rawPP.substring(0, 3)}-${rawPP.substring(3, 6)}-${rawPP.substring(6)}`;
            else if (rawPP.length === 13) fmtPP = `${rawPP.substring(0, 1)}-${rawPP.substring(1, 5)}-${rawPP.substring(5, 10)}-${rawPP.substring(10)}`;
            document.getElementById('txt-pp').innerText = fmtPP || "000-000-0000";

            // QR Generation
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";

            // Always generate a QR. If rawPP is missing, generatePayload handles fallback
            const payload = generatePayload(rawPP || '0000000000', val);

            if (payload) {
                new QRCode(qrContainer, {
                    text: payload,
                    width: 120,
                    height: 120,
                    colorDark: "#000",
                    colorLight: "#fff",
                    correctLevel: QRCode.CorrectLevel.L
                });

                // Convert Canvas to Image immediately for reliable html2canvas capture
                const canvas = qrContainer.querySelector('canvas');
                if (canvas) {
                    const img = document.createElement('img');
                    img.src = canvas.toDataURL('image/png');
                    img.style.width = '120px';
                    img.style.height = '120px';
                    img.style.display = 'block';
                    qrContainer.innerHTML = ''; // Clear canvas
                    qrContainer.appendChild(img);
                }
            }
        }

        // Action Buttons
        async function getCardBlob() {
            const card = document.getElementById('pay-card');
            const canvas = await html2canvas(card, {
                scale: 2,
                backgroundColor: null,
                useCORS: true
            });
            return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        }

        async function downloadCard() {
            const blob = await getCardBlob();
            const link = document.createElement('a');
            link.download = `SmartPay_${Date.now()}.png`;
            link.href = URL.createObjectURL(blob);
            link.click();
            showMsg("✅ บันทึกรูปแล้ว!");
        }

        async function copyCard() {
            try {
                const blob = await getCardBlob();
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                showMsg("✅ คัดลอกสลิปแล้ว!");
            } catch (err) {
                console.error(err);
                showMsg("❌ Browser นี้ไม่รองรับการ Copy รูป (ใช้ปุ่มบันทึกแทน)");
            }
        }

        function showMsg(text) {
            const el = document.getElementById('toast-overlay');
            const txt = document.getElementById('toast-text');
            const icon = el.querySelector('.toast-icon');

            txt.innerText = text;
            icon.innerText = text.includes('ไม่') || text.includes('Error') ? '❌' : '';

            el.classList.add('show');

            // Auto hide after 2 seconds
            if (window.toastTimer) clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 2500);
        }

        // Init
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            updatePreview();
            // Auto-focus amount field เมื่อเปิดหน้า (ใช้ได้ใน iframe)
            setTimeout(() => { els.amt.focus(); }, 100);

            // Auto-update ทุก field เมื่อพิมพ์
            [els.shop, els.pp, els.acc].forEach(el => {
                el.addEventListener('input', () => updatePreview());
            });
            els.amt.addEventListener('input', () => {
                updatePreview();
                handleAutoCopy();
            });

            // Global Key Listener — พิมพ์ตัวเลขทุกที่ = focus + ใส่ตัวเลขนั้น + ต่อได้เลย
            let fromGlobalKey = false; // flag: focus มาจาก global keydown

            document.addEventListener('keydown', (e) => {
                const active = document.activeElement;
                const isInInput = ['INPUT', 'TEXTAREA'].includes(active.tagName);

                if (/^[0-9]$/.test(e.key) && !isInInput) {
                    // ล้างค่าเดิม + ใส่ตัวเลขแรก + focus (ไม่ preventDefault เพื่อให้ browser พิมพ์ต่อ)
                    els.amt.value = '';
                    fromGlobalKey = true;
                    els.amt.focus();
                    // ปล่อยให้ browser พิมพ์ตัวเลขนี้เองผ่าน keydown ปกติ
                }

                // Backspace / Delete ทุกที่ → ล้าง + focus
                if ((e.key === 'Backspace' || e.key === 'Delete') && !isInInput) {
                    e.preventDefault();
                    els.amt.value = '';
                    els.amt.focus();
                    updatePreview();
                }
            });

            // เมื่อ focus: ถ้ามาจาก globalKey → cursor ท้าย; ถ้า click เอง → select all
            els.amt.addEventListener('focus', () => {
                if (fromGlobalKey) {
                    fromGlobalKey = false;
                    // ไม่ select — cursor อยู่ท้าย พร้อมพิมพ์ต่อ
                } else {
                    setTimeout(() => els.amt.select(), 0);
                }
            });


            // Auto Copy Logic
            let copyTimer = null;
            function handleAutoCopy() {
                if (copyTimer) clearTimeout(copyTimer);
                // Reset status if user is typing
                const toast = document.getElementById('toast-overlay');
                if (toast) toast.classList.remove('show');

                copyTimer = setTimeout(() => {
                    executeAutoCopy();
                }, 1500);
            }

            async function executeAutoCopy() {
                try {
                    // รอให้ QR img render เสร็จก่อน capture
                    await new Promise(r => setTimeout(r, 120));
                    const blob = await getCardBlob();
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                    showMsg('✅ คัดลอกสลิปแล้ว!');
                } catch (err) {
                    console.error('Auto copy failed', err);
                }
            }
        });

    </script>
</body>
